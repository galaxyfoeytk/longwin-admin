<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="龍吟後台">
<title>龍吟古早味飲品專賣 — 後台管理系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#185FA5;--blue-l:#E6F1FB;--blue-d:#0C447C;
  --green:#3B6D11;--green-l:#EAF3DE;
  --amber:#854F0B;--amber-l:#FAEEDA;--amber-m:#FAC775;
  --teal:#0F6E56;--teal-l:#E1F5EE;
  --purple:#534AB7;--purple-l:#EEEDFE;
  --coral:#993C1D;--coral-l:#FAECE7;
  --pink:#993556;--pink-l:#FBEAF0;
  --gray:#5F5E5A;--gray-l:#F1EFE8;
  --red:#A32D2D;--red-l:#FCEBEB;
  --bg:#F5F4F0;--surface:#FFF;
  --border:rgba(0,0,0,0.09);--border-md:rgba(0,0,0,0.16);
  --text:#1C1B18;--text-m:#6B6A66;--text-h:#A09E99;
  --r:14px;--rs:8px;--rx:5px;
  --font:'Noto Sans TC',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;font-family:var(--font);font-size:14px;background:var(--bg);color:var(--text);}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* LOADING */
#ls{position:fixed;inset:0;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity 0.4s;}
.li{font-size:48px;margin-bottom:14px;}
.lt{font-size:18px;font-weight:700;margin-bottom:4px;}
.ls2{font-size:13px;color:var(--text-m);margin-bottom:1.5rem;}
.lb{width:180px;height:3px;background:#E8E6E0;border-radius:10px;overflow:hidden;}
.lf{height:100%;background:var(--blue);border-radius:10px;animation:fill 1.6s ease forwards;}

/* LOGIN */
#lp{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);padding:1.5rem;}
.lw{width:100%;max-width:360px;animation:fadeUp 0.3s ease;}
.lb2{display:flex;align-items:center;gap:12px;margin-bottom:2rem;}
.bi{width:46px;height:46px;border-radius:12px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:24px;}
.bn{font-size:17px;font-weight:700;}
.bs{font-size:12px;color:var(--text-m);}
.lt2{font-size:24px;font-weight:700;margin-bottom:4px;}
.ls3{font-size:13px;color:var(--text-m);margin-bottom:1.75rem;}
.fg{margin-bottom:1rem;}
.fl{font-size:12px;font-weight:500;color:var(--text-m);margin-bottom:5px;display:block;}
.fi{width:100%;padding:0 13px;height:44px;font-size:14px;font-family:var(--font);border:1px solid var(--border-md);border-radius:var(--rs);background:var(--surface);color:var(--text);outline:none;transition:border-color 0.15s,box-shadow 0.15s;}
.fi:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,0.1);}
.pw{position:relative;}.pw .fi{padding-right:44px;}
.eb{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-h);font-size:16px;padding:0;}
.lst{font-size:13px;padding:10px 14px;border-radius:var(--rs);margin-bottom:1rem;display:none;align-items:center;gap:8px;}
.lst.error{background:var(--red-l);color:var(--red);border:1px solid #F7C1C1;}
.lst.loading{background:var(--blue-l);color:var(--blue-d);border:1px solid #B5D4F4;}
.sp{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite;flex-shrink:0;}
.lbtn{width:100%;height:46px;border-radius:var(--rs);background:var(--blue);color:white;border:none;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;transition:background 0.15s;}
.lbtn:hover{background:var(--blue-d);}
.lbtn:disabled{opacity:0.6;cursor:not-allowed;}

/* APP */
#ap{min-height:100%;display:none;flex-direction:column;}
.tb{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.25rem;gap:12px;flex-shrink:0;position:sticky;top:0;z-index:10;}
.tbl{width:30px;height:30px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:16px;}
.tbt{font-size:14px;font-weight:700;flex:1;}
.tbr{display:flex;align-items:center;gap:8px;}
.uc{display:flex;align-items:center;gap:7px;padding:5px 11px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);}
.ua{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.un{font-size:13px;}
.rp{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;}
.rp-1{background:#E6F1FB;color:#0C447C;}.rp-2{background:#EEEDFE;color:#3C3489;}.rp-3{background:#EAF3DE;color:#27500A;}
.rp-4{background:#FAEEDA;color:#633806;}.rp-5{background:#E1F5EE;color:#085041;}.rp-6{background:#FBEAF0;color:#72243E;}
.rp-7{background:#FAC775;color:#633806;}.rp-8{background:#F1EFE8;color:#444441;}
.av-1{background:#E6F1FB;color:#0C447C;}.av-2{background:#EEEDFE;color:#3C3489;}.av-3{background:#EAF3DE;color:#27500A;}
.av-4{background:#FAEEDA;color:#633806;}.av-5{background:#E1F5EE;color:#085041;}.av-6{background:#FBEAF0;color:#72243E;}
.av-7{background:#FAC775;color:#633806;}.av-8{background:#F1EFE8;color:#444441;}
.lgb{height:34px;padding:0 13px;font-size:13px;border:1px solid var(--border-md);border-radius:var(--rs);background:transparent;color:var(--text-m);cursor:pointer;font-family:var(--font);}
.lgb:hover{background:var(--bg);}

/* MAIN */
.main{padding:1.5rem;max-width:1200px;margin:0 auto;width:100%;}
.greet{margin-bottom:1.5rem;}
.greet-title{font-size:22px;font-weight:700;margin-bottom:4px;}
.greet-sub{font-size:14px;color:var(--text-m);}

/* SECTION */
.sec{margin-bottom:2rem;}
.sec-title{font-size:12px;font-weight:600;color:var(--text-h);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;padding-left:2px;}

/* CARDS GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1rem;cursor:pointer;transition:border-color 0.15s,transform 0.12s,box-shadow 0.12s;text-decoration:none;display:block;position:relative;}
.card:hover{border-color:var(--border-md);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.08);}
.card:active{transform:translateY(0);box-shadow:none;}
.card.locked{opacity:0.35;cursor:not-allowed;pointer-events:none;}
.card-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:20px;}
.ic-blue{background:#E6F1FB;}.ic-teal{background:#E1F5EE;}.ic-amber{background:#FAEEDA;}
.ic-green{background:#EAF3DE;}.ic-coral{background:#FAECE7;}.ic-purple{background:#EEEDFE;}
.ic-pink{background:#FBEAF0;}.ic-gray{background:#F1EFE8;}.ic-red{background:#FCEBEB;}
.card-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;}
.card-desc{font-size:11px;color:var(--text-m);line-height:1.5;}
.card-badge{position:absolute;top:10px;right:10px;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;}
.b-ok{background:var(--green-l);color:var(--green);}
.b-no{background:var(--gray-l);color:var(--gray);}

/* PERM TAGS */
.prow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem;}
.ptag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;}
.ptag-w{background:var(--teal-l);color:var(--teal);}
.ptag-r{background:var(--purple-l);color:var(--purple);}
.ptag-v{background:var(--blue-l);color:var(--blue-d);}
.ptag-e{background:var(--amber-l);color:var(--amber);}

/* BOTTOM */
.bb{background:var(--surface);border-top:1px solid var(--border);padding:10px 1.25rem;display:flex;align-items:center;gap:10px;font-size:12px;margin-top:auto;}
.bd{width:7px;height:7px;border-radius:50%;background:#639922;flex-shrink:0;}
.bt{color:var(--text-m);flex:1;}
.bl{color:var(--blue);}

@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr);}
  .main{padding:1rem;}
}
</style>
</head>
<body>

<div id="ls">
  <div class="li">☕</div>
  <div class="lt">龍吟古早味飲品專賣</div>
  <div class="ls2">後台管理系統載入中...</div>
  <div class="lb"><div class="lf"></div></div>
</div>

<div id="lp" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;">
  <div class="lw">
    <div class="lb2">
      <div class="bi">☕</div>
      <div><div class="bn">龍吟古早味飲品專賣</div><div class="bs">後台管理系統</div></div>
    </div>
    <div class="lt2">登入</div>
    <div class="ls3">輸入帳號密碼進入後台</div>
    <div id="lst" class="lst"></div>
    <div class="fg"><label class="fl">帳號</label><input class="fi" type="text" id="uname" placeholder="輸入帳號" autocomplete="username"/></div>
    <div class="fg"><label class="fl">密碼</label>
      <div class="pw">
        <input class="fi" type="password" id="upass" placeholder="輸入密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
        <button class="eb" onclick="togglePw()" type="button">👁</button>
      </div>
    </div>
    <button class="lbtn" id="lbtn" onclick="doLogin()">→ 登入</button>
  </div>
</div>

<div id="ap" style="min-height:100vh;flex-direction:column;">
  <div class="tb">
    <div class="tbl">☕</div>
    <span class="tbt">龍吟古早味飲品專賣</span>
    <div class="tbr">
      <div class="uc">
        <div class="ua" id="tav"></div>
        <span class="un" id="tnm"></span>
        <span class="rp" id="trl"></span>
      </div>
      <button class="lgb" onclick="doLogout()">↩ 登出</button>
    </div>
  </div>

  <div class="main">
    <div class="greet">
      <div class="greet-title" id="ht">歡迎回來</div>
      <div class="greet-sub" id="hd">請選擇功能模組</div>
    </div>
    <div class="prow" id="prow"></div>

    <div class="sec">
      <div class="sec-title">📋 現場記錄</div>
      <div class="grid" id="g-daily"></div>
    </div>

    <div class="sec">
      <div class="sec-title">📊 統計報表</div>
      <div class="grid" id="g-stats"></div>
    </div>

    <div class="sec">
      <div class="sec-title">📦 庫存進貨</div>
      <div class="grid" id="g-stock"></div>
    </div>

    <div class="sec">
      <div class="sec-title">📅 排程管理</div>
      <div class="grid" id="g-schedule"></div>
    </div>

    <div class="sec">
      <div class="sec-title">⚙️ 系統管理</div>
      <div class="grid" id="g-system"></div>
    </div>
  </div>

  <div class="bb">
    <div class="bd"></div>
    <span class="bt">龍吟古早味飲品專賣・已連線 Google Sheets</span>
    <a class="bl" href="https://docs.google.com/spreadsheets/d/1OJXO0Uq6XUzXXDraGoFi-uLZDUNhvbaTgFRgZG6cHNs/edit" target="_blank">開啟試算表 ↗</a>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxZg8p4Aofjh_x43koax5MJfRmAWqewo6az9dEtLqImA6KM5bb6U7RvL5uPxy7Xy1Vn/exec';
const RL = {1:'系統最高管理員',2:'營運管理者',3:'店長',4:'副店長',5:'正職員工',6:'工讀生',7:'財務/會計',8:'外部顧問'};
const RC = {1:'rp-1',2:'rp-2',3:'rp-3',4:'rp-4',5:'rp-5',6:'rp-6',7:'rp-7',8:'rp-8'};
const AC = {1:'av-1',2:'av-2',3:'av-3',4:'av-4',5:'av-5',6:'av-6',7:'av-7',8:'av-8'};

// 模組定義：分組 / 圖示 / 名稱 / 描述 / 連結 / 可用角色
const GROUPS = {
  'g-daily': [
    {e:'🍵',cl:'ic-coral',n:'茶製記錄',d:'製茶批次・效期・狀態追蹤',href:'tea.html',r:[1,2,3,4,5]},
    {e:'🌡',cl:'ic-amber',n:'溫度記錄',d:'冷藏冷凍冰箱每日 2 次',href:'temp.html',r:[1,2,3,4,5,6]},
    {e:'💧',cl:'ic-teal',n:'試飲記錄',d:'仙草・杏仁每日試飲',href:'taste.html',r:[1,2,3,4,5]},
    {e:'⚡',cl:'ic-green',n:'電表記錄',d:'每日開班電表度數',href:'elec.html',r:[1,2,3,4,5,6]},
    {e:'🔩',cl:'ic-gray',n:'濾心記錄',d:'濾心更換記錄',href:'filter.html',r:[1,2,3,4,5,6]},
  ],
  'g-stats': [
    {e:'☕',cl:'ic-purple',n:'每日杯數統計',d:'仙草・杏仁・撞奶每日數量',href:'cups.html',r:[1,2,3,4]},
    {e:'📈',cl:'ic-blue',n:'仙草杏仁統計表',d:'月匯總・趨勢・比較分析',href:'jellystat.html',r:[1,2,3,4,7,8]},
    {e:'📊',cl:'ic-teal',n:'報表分析',d:'營收・杯數・趨勢總覽',href:'report.html',r:[1,2,7,8]},
  ],
  'g-stock': [
    {e:'📦',cl:'ic-blue',n:'叫貨記錄',d:'龍吟總店・日本鶴神叫貨單',href:'order.html',r:[1,2,3,4,5]},
    {e:'🗂',cl:'ic-amber',n:'雙週盤點',d:'每兩週盤點・差異分析',href:'biweekly.html',r:[1,2,3,4]},
    {e:'📋',cl:'ic-green',n:'月盤點',d:'每月完整盤點・庫存結算',href:'monthly.html',r:[1,2,3,4]},
    {e:'🏪',cl:'ic-pink',n:'市場紀錄',d:'月市場仙草杏仁銷售記錄',href:'market.html',r:[1,2,3,4]},
  ],
  'g-schedule': [
    {e:'📅',cl:'ic-purple',n:'週排程日曆',d:'出貨・叫貨・行程安排',href:'calendar.html',r:[1,2,3,4]},
    {e:'⏱',cl:'ic-gray',n:'時數記錄',d:'員工出勤時數',href:'hours.html',r:[1,2,3,4]},
  ],
  'g-system': [
    {e:'👥',cl:'ic-gray',n:'帳號管理',d:'帳號設定・角色指派',href:'users.html',r:[1]},
    {e:'📋',cl:'ic-red',n:'操作紀錄',d:'所有操作完整保存',href:'logs.html',r:[1,2,3]},
  ],
};

const PERMS = [
  {lbl:'填寫權限',cl:'ptag-w',r:[1,2,3,4,5,6]},
  {lbl:'審核權限',cl:'ptag-r',r:[1,2,3,4]},
  {lbl:'查看權限',cl:'ptag-v',r:[1,2,3,4,7,8]},
  {lbl:'修改/刪除',cl:'ptag-e',r:[1]},
];

var CU = null;

async function callApi(params) {
  var url = API + '?' + Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v||'')).join('&');
  try { var r = await fetch(url); return await r.json(); } catch(e) { return {ok:false,error:e.message}; }
}

window.addEventListener('load', () => {
  // 檢查是否已登入（session storage）
  var saved = sessionStorage.getItem('longyinUser');
  if (saved) {
    try { CU = JSON.parse(saved); } catch(e) {}
  }
  setTimeout(() => {
    var ls = document.getElementById('ls');
    ls.style.opacity = '0';
    setTimeout(() => {
      ls.style.display = 'none';
      if (CU) { buildApp(); }
      else { document.getElementById('lp').style.display = 'flex'; }
    }, 400);
  }, 1400);
});

async function doLogin() {
  var uname = document.getElementById('uname').value.trim();
  var upass = document.getElementById('upass').value;
  var btn = document.getElementById('lbtn');
  if (!uname||!upass) { showLst('請輸入帳號和密碼','error'); return; }
  btn.disabled = true;
  showLst('驗證中...','loading');
  var r = await callApi({action:'login', username:uname, password:upass});
  if (r.ok && r.user) {
    CU = r.user;
    sessionStorage.setItem('longyinUser', JSON.stringify(CU));
    buildApp();
    document.getElementById('lp').style.display = 'none';
    document.getElementById('ap').style.display = 'flex';
    btn.disabled = false;
    document.getElementById('lst').style.display = 'none';
  } else {
    btn.disabled = false;
    showLst(r.error||'帳號或密碼錯誤','error');
  }
}

function showLst(msg, type) {
  var el = document.getElementById('lst');
  el.style.display = 'flex';
  el.className = 'lst ' + type;
  el.innerHTML = type==='loading' ? '<div class="sp"></div>'+msg : '⚠ '+msg;
}

function doLogout() {
  CU = null;
  sessionStorage.removeItem('longyinUser');
  document.getElementById('uname').value = '';
  document.getElementById('upass').value = '';
  document.getElementById('ap').style.display = 'none';
  document.getElementById('lp').style.display = 'flex';
}

function togglePw() {
  var i = document.getElementById('upass');
  i.type = i.type==='text'?'password':'text';
}

function buildApp() {
  var u = CU;
  var av = document.getElementById('tav');
  av.textContent = (u.name||'?')[0];
  av.className = 'ua '+(AC[u.role]||'av-5');
  document.getElementById('tnm').textContent = u.name;
  var rl = document.getElementById('trl');
  rl.textContent = RL[u.role]||u.label||'員工';
  rl.className = 'rp '+(RC[u.role]||'rp-5');
  document.getElementById('ht').textContent = '歡迎回來，'+u.name+' 👋';
  document.getElementById('hd').textContent = '角色：'+(RL[u.role]||u.label)+'・請選擇功能模組';

  // 權限標籤
  var pr = document.getElementById('prow'); pr.innerHTML='';
  PERMS.forEach(p=>{ if(p.r.includes(u.role)){var t=document.createElement('span');t.className='ptag '+p.cl;t.textContent='✓ '+p.lbl;pr.appendChild(t);} });

  // 建立各分組卡片
  Object.entries(GROUPS).forEach(([gid, mods]) => {
    var grid = document.getElementById(gid); if(!grid) return;
    grid.innerHTML = '';
    mods.forEach(m => {
      var ok = m.r.includes(u.role);
      var a = document.createElement('a');
      a.className = 'card' + (ok?'':' locked');
      a.href = ok ? m.href : '#';
      // 傳遞登入資訊到子頁面
      if(ok) {
        a.addEventListener('click', function(e) {
          sessionStorage.setItem('longyinUser', JSON.stringify(CU));
        });
      }
      a.innerHTML = `<div class="card-icon ${m.cl}">${m.e}</div><div class="card-name">${m.n}</div><div class="card-desc">${m.d}</div><span class="card-badge ${ok?'b-ok':'b-no'}">${ok?'可使用':'無權限'}</span>`;
      grid.appendChild(a);
    });
  });

  document.getElementById('ap').style.display = 'flex';
}
</script>
</body>
</html>
