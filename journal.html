<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>店長週日誌 — 龍吟後台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1rem;background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:0 1rem;}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text-m);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font);}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal);}
.tab-pane{display:none;}.tab-pane.active{display:block;}

/* ── 週選擇器 ── */
.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.week-nav-btn{height:32px;width:32px;border:1px solid var(--border-md);border-radius:var(--rx);background:var(--surface);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.week-nav-btn:hover{background:var(--bg);}
.week-label{font-size:14px;font-weight:600;flex:1;text-align:center;}
.week-pill{font-size:11px;color:var(--text-m);padding:3px 10px;border:1px solid var(--border-md);border-radius:20px;cursor:pointer;}
.week-pill:hover{background:var(--teal-l);color:var(--teal);border-color:var(--teal);}

/* ── 評分星星 ── */
.star-row{display:flex;gap:6px;align-items:center;}
.star{font-size:22px;cursor:pointer;opacity:.3;transition:opacity .1s;}
.star.on{opacity:1;}

/* ── 段落 label ── */
.section-label{font-size:12px;font-weight:600;color:var(--text-m);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.section-label span{font-size:10px;font-weight:400;color:var(--text-h);}

/* ── 歷史日誌卡片 ── */
.journal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:10px;overflow:hidden;}
.jc-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.jc-head:hover{background:var(--bg);}
.jc-title{font-size:14px;font-weight:600;}
.jc-sub{font-size:12px;color:var(--text-m);margin-top:2px;}
.jc-body{padding:14px;display:none;}
.jc-body.open{display:block;}
.jc-section{margin-bottom:12px;}
.jc-section-lbl{font-size:11px;font-weight:600;color:var(--text-m);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
.jc-text{font-size:13px;color:var(--text);line-height:1.7;white-space:pre-wrap;}
.score-display{display:flex;gap:3px;}
.score-star{font-size:16px;opacity:.25;}.score-star.on{opacity:1;}

/* ── 草稿提示 ── */
.draft-bar{background:var(--amber-l);border:1px solid var(--amber-m);border-radius:var(--rx);padding:8px 12px;font-size:12px;color:var(--amber);display:flex;align-items:center;gap:8px;margin-bottom:10px;}

/* ── 文字區 ── */
.textarea-styled{width:100%;border:1px solid var(--border-md);border-radius:var(--rx);padding:10px 12px;font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface);resize:vertical;outline:none;line-height:1.7;}
.textarea-styled:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(24,95,165,.1);}
.spin{width:13px;height:13px;border:2px solid var(--teal-l);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px;margin-right:5px;}

/* ── 評分說明 ── */
.score-hint{font-size:11px;color:var(--text-h);margin-left:8px;}
</style>
</head>
<body>
<div class="tb">
  <div class="tbl" onclick="goHome()">📓</div>
  <div class="page-title-wrap">
    <div class="page-title-main" id="page-title">店長週日誌</div>
    <div class="page-title-sub" id="page-sub">每週工作回顧・目標追蹤</div>
  </div>
  <div class="tbr">
    <div class="uc"><div class="ua" id="tav"></div><span class="un" id="tnm"></span><span class="rp" id="trl"></span></div>
    <button class="lgb" onclick="goHome()">🏠 主頁</button>
    <button class="lgb" onclick="doLogout()">↩ 登出</button>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('write')">✏️ 撰寫日誌</button>
    <button class="tab-btn" onclick="switchTab('history')">📚 歷史日誌</button>
  </div>

  <!-- ═══ 撰寫 ═══ -->
  <div id="tab-write" class="tab-pane active">
    <!-- 週選擇器 -->
    <div class="fc" style="padding:14px;">
      <div class="week-nav">
        <button class="week-nav-btn" onclick="changeWeek(-1)">‹</button>
        <div class="week-label" id="weekLabel">--</div>
        <button class="week-nav-btn" onclick="changeWeek(1)">›</button>
        <span class="week-pill" onclick="goThisWeek()">本週</span>
      </div>
      <div id="weekDateRange" style="font-size:12px;color:var(--text-m);text-align:center;"></div>
    </div>

    <div id="draftBar" class="draft-bar" style="display:none;">
      📝 已有本週草稿，載入中或可修改後儲存
    </div>

    <div class="fc">
      <div class="fct">📓 本週回顧</div>

      <div style="margin-bottom:14px;">
        <div class="section-label">🌟 本週亮點 <span>做得好的事、值得記錄的成果</span></div>
        <textarea class="textarea-styled" id="j-highlights" rows="3" placeholder="例如：本週仙草茶銷量創新高、新品試喝反應良好…"></textarea>
      </div>

      <div style="margin-bottom:14px;">
        <div class="section-label">⚠️ 本週問題 <span>遇到的困難、待解決的事項</span></div>
        <textarea class="textarea-styled" id="j-issues" rows="3" placeholder="例如：午尖峰人手不足、某批茶葉品質異常…"></textarea>
      </div>

      <div style="margin-bottom:14px;">
        <div class="section-label">🔄 改善建議 <span>針對問題提出的改善方向</span></div>
        <textarea class="textarea-styled" id="j-improvements" rows="3" placeholder="例如：建議增加週五排班人手、改用 B 廠商茶葉…"></textarea>
      </div>

      <div style="margin-bottom:14px;">
        <div class="section-label">🎯 下週目標</div>
        <textarea class="textarea-styled" id="j-nextweek" rows="3" placeholder="設定下週的重點工作目標…"></textarea>
      </div>

      <div style="margin-bottom:14px;">
        <div class="section-label">💬 其他備註</div>
        <textarea class="textarea-styled" id="j-note" rows="2" placeholder="人員異動、老闆交辦、其他備忘…"></textarea>
      </div>

      <!-- 評分 -->
      <div style="background:var(--bg);border-radius:var(--rs);padding:12px 14px;">
        <div class="section-label" style="margin-bottom:10px;">⭐ 本週整體評分</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <div style="font-size:12px;color:var(--text-m);margin-bottom:6px;">服務品質</div>
            <div class="star-row" id="score-service">
              <span class="star" onclick="setScore('service',1)">⭐</span>
              <span class="star" onclick="setScore('service',2)">⭐</span>
              <span class="star" onclick="setScore('service',3)">⭐</span>
              <span class="star" onclick="setScore('service',4)">⭐</span>
              <span class="star" onclick="setScore('service',5)">⭐</span>
            </div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--text-m);margin-bottom:6px;">團隊士氣</div>
            <div class="star-row" id="score-morale">
              <span class="star" onclick="setScore('morale',1)">⭐</span>
              <span class="star" onclick="setScore('morale',2)">⭐</span>
              <span class="star" onclick="setScore('morale',3)">⭐</span>
              <span class="star" onclick="setScore('morale',4)">⭐</span>
              <span class="star" onclick="setScore('morale',5)">⭐</span>
            </div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--text-m);margin-bottom:6px;">店面整潔</div>
            <div class="star-row" id="score-clean">
              <span class="star" onclick="setScore('clean',1)">⭐</span>
              <span class="star" onclick="setScore('clean',2)">⭐</span>
              <span class="star" onclick="setScore('clean',3)">⭐</span>
              <span class="star" onclick="setScore('clean',4)">⭐</span>
              <span class="star" onclick="setScore('clean',5)">⭐</span>
            </div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--text-m);margin-bottom:6px;">整體績效</div>
            <div class="star-row" id="score-overall">
              <span class="star" onclick="setScore('overall',1)">⭐</span>
              <span class="star" onclick="setScore('overall',2)">⭐</span>
              <span class="star" onclick="setScore('overall',3)">⭐</span>
              <span class="star" onclick="setScore('overall',4)">⭐</span>
              <span class="star" onclick="setScore('overall',5)">⭐</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:1rem;">
      <button class="sbtn" style="background:var(--gray);height:38px;" onclick="saveDraft()">💾 儲存草稿</button>
      <button class="sbtn g" style="height:38px;" id="saveJournalBtn" onclick="saveJournal()">📤 送出日誌</button>
    </div>
  </div>

  <!-- ═══ 歷史 ═══ -->
  <div id="tab-history" class="tab-pane">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div style="font-size:13px;color:var(--text-m);">點擊展開查看完整日誌</div>
      <button class="sbtn g" style="height:32px;font-size:12px;" onclick="loadHistory()">🔄 重新整理</button>
    </div>
    <div id="historyList"><div style="text-align:center;padding:2rem;color:var(--text-h);font-size:13px;">載入中…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="bb"><div class="bd"></div><span class="bt">龍吟古早味飲品專賣・店長週日誌</span></div>

<script src="base.js"></script>
<script>
var _currentWeekStart = null;
var _scores = { service: 0, morale: 0, clean: 0, overall: 0 };
var _journals = [];
var _currentUser = '';
var _isDraft = false;

window.addEventListener('load', () => {
  var u = buildSubHeader('店長週日誌', '每週工作回顧・目標追蹤');
  if (!u) return;
  _currentUser = u.name;
  goThisWeek();
});

function switchTab(name) {
  document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelectorAll('.tab-btn')[ name === 'write' ? 0 : 1 ].classList.add('active');
  if (name === 'history') loadHistory();
}

// ════════════════════════════════════════
// 週導航
// ════════════════════════════════════════
function getWeekStart(date) {
  var d = new Date(date);
  var day = d.getDay(); // 0=週日
  var diff = day === 0 ? -6 : 1 - day; // 週一為起點
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function goThisWeek() {
  _currentWeekStart = getWeekStart(new Date());
  updateWeekUI();
  loadWeekDraft();
}

function changeWeek(dir) {
  var d = new Date(_currentWeekStart);
  d.setDate(d.getDate() + dir * 7);
  _currentWeekStart = d;
  updateWeekUI();
  loadWeekDraft();
}

function getWeekKey() {
  return _currentWeekStart.toISOString().slice(0,10);
}

function updateWeekUI() {
  var start = _currentWeekStart;
  var end = new Date(start); end.setDate(end.getDate() + 6);
  var fmt = d => (d.getMonth()+1) + '/' + d.getDate();
  var DOW = ['日','一','二','三','四','五','六'];
  document.getElementById('weekLabel').textContent =
    start.getFullYear() + ' 第 ' + getWeekNumber(start) + ' 週';
  document.getElementById('weekDateRange').textContent =
    fmt(start) + '（一）～ ' + fmt(end) + '（' + DOW[end.getDay()] + '）';
}

function getWeekNumber(d) {
  var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
  var yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}

// ════════════════════════════════════════
// 草稿讀寫（localStorage）
// ════════════════════════════════════════
function getDraftKey() {
  return 'lw_journal_draft_' + getWeekKey() + '_' + _currentUser;
}

function saveDraft() {
  var data = getFormData();
  localStorage.setItem(getDraftKey(), JSON.stringify(data));
  toast('✓ 草稿已儲存', 'ok');
}

async function loadWeekDraft() {
  // 清空表單
  clearForm();

  // 先嘗試從 Sheets 讀取已送出的日誌
  var r = await api({ action: 'journalGet', weekKey: getWeekKey(), author: _currentUser });
  if (r.ok && r.data) {
    applyFormData(r.data);
    document.getElementById('draftBar').style.display = 'none';
    document.getElementById('draftBar').textContent = '✓ 本週日誌已送出，可繼續修改';
    document.getElementById('draftBar').style.display = 'flex';
    document.getElementById('saveJournalBtn').textContent = '📤 更新日誌';
    _isDraft = false;
    return;
  }

  // 讀取本地草稿
  var draftStr = localStorage.getItem(getDraftKey());
  if (draftStr) {
    try {
      var draft = JSON.parse(draftStr);
      applyFormData(draft);
      document.getElementById('draftBar').style.display = 'flex';
      document.getElementById('draftBar').textContent = '📝 已載入本週草稿，可繼續編輯';
      _isDraft = true;
    } catch(e) {}
  } else {
    document.getElementById('draftBar').style.display = 'none';
    _isDraft = false;
  }
  document.getElementById('saveJournalBtn').textContent = '📤 送出日誌';
}

function getFormData() {
  return {
    highlights: document.getElementById('j-highlights').value,
    issues: document.getElementById('j-issues').value,
    improvements: document.getElementById('j-improvements').value,
    nextweek: document.getElementById('j-nextweek').value,
    note: document.getElementById('j-note').value,
    scores: { ..._scores }
  };
}

function applyFormData(d) {
  document.getElementById('j-highlights').value = d.highlights || '';
  document.getElementById('j-issues').value = d.issues || '';
  document.getElementById('j-improvements').value = d.improvements || '';
  document.getElementById('j-nextweek').value = d.nextweek || '';
  document.getElementById('j-note').value = d.note || '';
  if (d.scores) {
    Object.entries(d.scores).forEach(([k,v]) => setScore(k, parseInt(v)||0));
  }
}

function clearForm() {
  ['j-highlights','j-issues','j-improvements','j-nextweek','j-note'].forEach(id => {
    var el = document.getElementById(id); if (el) el.value = '';
  });
  _scores = { service: 0, morale: 0, clean: 0, overall: 0 };
  ['service','morale','clean','overall'].forEach(k => updateStars(k, 0));
}

// ════════════════════════════════════════
// 星星評分
// ════════════════════════════════════════
function setScore(key, val) {
  _scores[key] = val;
  updateStars(key, val);
}

function updateStars(key, val) {
  var row = document.getElementById('score-' + key);
  if (!row) return;
  row.querySelectorAll('.star').forEach((s, i) => {
    s.classList.toggle('on', i < val);
  });
}

// ════════════════════════════════════════
// 送出日誌
// ════════════════════════════════════════
async function saveJournal() {
  var weekKey = getWeekKey();
  var data = getFormData();
  if (!data.highlights && !data.issues && !data.nextweek) {
    toast('請至少填寫本週亮點或問題', 'er'); return;
  }

  var btn = document.getElementById('saveJournalBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>送出中…';

  var r = await api({
    action: 'journalSave',
    weekKey, author: _currentUser,
    highlights: data.highlights, issues: data.issues,
    improvements: data.improvements, nextweek: data.nextweek,
    note: data.note, scores: JSON.stringify(data.scores)
  });

  btn.disabled = false; btn.innerHTML = '📤 更新日誌';

  if (r.ok) {
    // 清除草稿
    localStorage.removeItem(getDraftKey());
    toast('✓ 週日誌已送出', 'ok');
    document.getElementById('draftBar').textContent = '✓ 本週日誌已送出';
    document.getElementById('draftBar').style.display = 'flex';
  } else {
    toast('送出失敗：' + (r.error||''), 'er');
  }
}

// ════════════════════════════════════════
// 歷史
// ════════════════════════════════════════
async function loadHistory() {
  document.getElementById('historyList').innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-h);">載入中…</div>';
  var r = await api({ action: 'journalGetAll' });
  _journals = r.ok ? (r.data || []) : [];
  renderHistory();
}

function renderHistory() {
  var el = document.getElementById('historyList');
  if (!_journals.length) {
    el.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-h);font-size:13px;">尚無日誌記錄</div>';
    return;
  }

  var sorted = [..._journals].sort((a,b) => (b.weekKey||'').localeCompare(a.weekKey||''));
  el.innerHTML = sorted.map(j => {
    var scores = {};
    try { scores = JSON.parse(j.scores||'{}'); } catch(e){}
    var scoreHtml = Object.entries({ service:'服務品質', morale:'團隊士氣', clean:'店面整潔', overall:'整體績效' })
      .map(([k, lbl]) => {
        var v = parseInt(scores[k]) || 0;
        var stars = [1,2,3,4,5].map(i => `<span class="score-star${i<=v?' on':''}">⭐</span>`).join('');
        return `<span style="font-size:12px;color:var(--text-m);margin-right:12px;">${lbl} ${stars}</span>`;
      }).join('');

    var sections = [
      { lbl:'本週亮點', val: j.highlights },
      { lbl:'本週問題', val: j.issues },
      { lbl:'改善建議', val: j.improvements },
      { lbl:'下週目標', val: j.nextweek },
      { lbl:'其他備註', val: j.note },
    ].filter(s => s.val);

    return `<div class="journal-card">
      <div class="jc-head" onclick="toggleJournal('jb-${j.id}','arr-${j.id}')">
        <div>
          <div class="jc-title">第 ${j.weekKey ? getWeekNumberFromKey(j.weekKey) : '-'} 週日誌</div>
          <div class="jc-sub">📅 ${j.weekKey||''}　✍️ ${j.author||''}</div>
        </div>
        <span style="color:var(--text-h);font-size:18px;" id="arr-${j.id}">›</span>
      </div>
      <div class="jc-body" id="jb-${j.id}">
        <div style="margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px;">${scoreHtml}</div>
        ${sections.map(s => `<div class="jc-section">
          <div class="jc-section-lbl">${s.lbl}</div>
          <div class="jc-text">${s.val}</div>
        </div>`).join('')}
        <button class="sbtn" style="height:28px;font-size:11px;background:var(--gray);margin-top:6px;" onclick="deleteJournal('${j.id}')">刪除</button>
      </div>
    </div>`;
  }).join('');
}

function toggleJournal(bodyId, arrId) {
  var body = document.getElementById(bodyId);
  var arr = document.getElementById(arrId);
  if (!body) return;
  body.classList.toggle('open');
  if (arr) arr.textContent = body.classList.contains('open') ? '˅' : '›';
}

function getWeekNumberFromKey(weekKey) {
  var d = new Date(weekKey + 'T00:00:00');
  return getWeekNumber(d);
}

async function deleteJournal(id) {
  if (!confirm('確定刪除此日誌？')) return;
  var r = await api({ action: 'journalDelete', id });
  if (r.ok) { toast('已刪除', 'ok'); loadHistory(); }
  else toast('刪除失敗', 'er');
}
</script>
</body>
</html>
