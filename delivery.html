<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>宅配出貨 — 龍吟後台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* ── 分頁 ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1rem;background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:0 1rem;}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text-m);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font);}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal);}
.tab-pane{display:none;}.tab-pane.active{display:block;}

/* ── 品項列 ── */
.items-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px;}
.items-table th{font-size:12px;font-weight:500;color:var(--text-m);padding:5px 8px;border-bottom:1px solid var(--border);text-align:left;}
.items-table td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:middle;}
.items-table select,.items-table input[type=number]{font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface);border:1px solid var(--border-md);border-radius:var(--rx);padding:5px 7px;outline:none;}
.items-table select{width:100%;}
.items-table input[type=number]{width:70px;}
.items-table select:focus,.items-table input:focus{border-color:var(--blue);}
.box-cell{font-size:12px;color:var(--teal);font-weight:600;}
.box-badge{display:inline-flex;align-items:center;gap:5px;background:var(--teal-l);color:var(--teal);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;margin-top:6px;}

/* ── 金額欄 ── */
.amount-row{display:none;}

/* ── 解析區 ── */
.parse-box{background:var(--bg);border:1px solid var(--border-md);border-radius:var(--rs);padding:10px 12px;margin-bottom:6px;}
.parse-box textarea{width:100%;background:transparent;border:none;outline:none;font-family:var(--font);font-size:13px;color:var(--text);resize:none;line-height:1.7;}
.parse-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
.status-msg{font-size:12px;color:var(--text-m);min-height:20px;margin-bottom:8px;}
.status-msg.ok{color:var(--teal);}
.status-msg.er{color:var(--red);}

/* ── 總表 ── */
.period-bar{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap;}
.prd-btn{padding:5px 14px;font-size:12px;border-radius:20px;cursor:pointer;border:1px solid var(--border-md);background:transparent;color:var(--text-m);font-family:var(--font);}
.prd-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:1rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;}
.sc-label{font-size:11px;color:var(--text-m);margin-bottom:4px;}
.sc-val{font-size:22px;font-weight:700;color:var(--text);}
.sc-sub{font-size:11px;color:var(--text-m);margin-top:2px;}
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:10px 14px;margin-bottom:8px;}
.oc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;}
.oc-name{font-weight:600;font-size:14px;}
.oc-date{font-size:12px;color:var(--text-m);}
.oc-items{font-size:13px;color:var(--text-m);margin-bottom:3px;}
.oc-box{font-size:11px;color:var(--teal);background:var(--teal-l);border-radius:20px;padding:1px 9px;display:inline-block;font-weight:600;}
.oc-pay{font-size:12px;color:var(--text-m);margin-top:3px;}
.del-btn{height:26px;padding:0 9px;font-size:11px;border:1px solid var(--border-md);border-radius:var(--rx);background:transparent;color:var(--text-m);cursor:pointer;font-family:var(--font);}
.del-btn:hover{background:var(--red-l);color:var(--red);border-color:var(--red);}
.empty-tip{text-align:center;padding:2rem 0;color:var(--text-h);font-size:13px;}

/* ── 品項設定 ── */
.prod-row{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:var(--rs);padding:8px 12px;margin-bottom:6px;font-size:13px;}
.prod-name{font-weight:600;min-width:100px;}
.prod-alias{flex:1;color:var(--text-m);font-size:12px;}

/* ── highlight ── */
.hl .ffi,.hl .ffs{border-color:var(--teal);background:#F0FBF7;}


/* ── 出貨流程 ── */
.flow-date-group{margin-bottom:1.5rem;}
.flow-date-label{font-size:13px;font-weight:700;color:var(--text-m);padding:6px 0;border-bottom:2px solid var(--teal);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.flow-date-label span{background:var(--teal);color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;}
.flow-cards{display:flex;flex-direction:column;gap:12px;}
.flow-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;}
.flow-card-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
.flow-card-name{font-weight:700;font-size:14px;}
.flow-card-meta{font-size:12px;color:var(--text-m);}
.flow-card-progress{display:flex;align-items:center;gap:4px;}
.flow-prog-bar{height:4px;border-radius:2px;background:var(--border);flex:1;min-width:60px;overflow:hidden;}
.flow-prog-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .3s;}
.flow-prog-txt{font-size:11px;color:var(--teal);font-weight:600;min-width:28px;text-align:right;}
.flow-steps{padding:10px 14px;display:flex;flex-direction:column;gap:6px;}
.flow-step{display:flex;align-items:flex-start;gap:10px;padding:6px 8px;border-radius:var(--rx);transition:background .15s;}
.flow-step:hover{background:var(--bg);}
.flow-step.done{opacity:.7;}
.flow-step-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-md);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s;font-size:13px;}
.flow-step.done .flow-step-check{background:var(--teal);border-color:var(--teal);color:#fff;}
.flow-step-body{flex:1;}
.flow-step-label{font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:6px;}
.flow-step.done .flow-step-label{text-decoration:line-through;color:var(--text-m);}
.flow-step-time{font-size:11px;color:var(--text-h);margin-top:2px;}
.flow-step-notify{font-size:10px;background:#FFF3CD;color:#856404;border-radius:4px;padding:1px 6px;font-weight:500;}
.flow-step-photo{margin-top:6px;}
.photo-upload-area{border:1.5px dashed var(--border-md);border-radius:var(--rx);padding:8px 12px;font-size:12px;color:var(--text-m);cursor:pointer;display:flex;align-items:center;gap:8px;transition:border-color .15s;}
.photo-upload-area:hover{border-color:var(--teal);}
.photo-thumb{width:60px;height:60px;object-fit:cover;border-radius:var(--rx);border:1px solid var(--border);cursor:pointer;}
.photo-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.line-token-box{background:var(--bg);border:1px solid var(--border-md);border-radius:var(--rs);padding:12px 14px;margin-bottom:12px;}
.line-token-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
.notify-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:#E8F5E9;color:#2E7D32;border-radius:20px;padding:2px 8px;font-weight:500;}


/* ── 定期訂單 ── */
.recur-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:10px 14px;margin-bottom:8px;}
.recur-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px;}
.recur-name{font-weight:600;font-size:14px;}
.recur-meta{font-size:12px;color:var(--text-m);margin-top:2px;}
.recur-days{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.day-pill{padding:3px 10px;border-radius:20px;font-size:12px;border:1px solid var(--border-md);background:var(--bg);color:var(--text-m);cursor:pointer;font-family:var(--font);}
.day-pill.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500;}
.recur-actions{display:flex;gap:6px;flex-shrink:0;}

/* ── spinner ── */
.spin{width:13px;height:13px;border:2px solid var(--teal-l);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px;margin-right:5px;}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="tb">
  <div class="tbl" onclick="goHome()">📦</div>
  <div class="page-title-wrap">
    <div class="page-title-main" id="page-title">宅配出貨</div>
    <div class="page-title-sub" id="page-sub">開單・總表・品項管理</div>
  </div>
  <div class="tbr">
    <div class="uc"><div class="ua" id="tav"></div><span class="un" id="tnm"></span><span class="rp" id="trl"></span></div>
    <button class="lgb" onclick="goHome()">🏠 主頁</button>
    <button class="lgb" onclick="doLogout()">↩ 登出</button>
  </div>
</div>

<div class="main">

  <!-- 分頁按鈕 -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('order')">📋 開單</button>
    <button class="tab-btn" onclick="switchTab('summary')">📊 總表</button>
    <button class="tab-btn" onclick="switchTab('products')">🏷️ 品項設定</button>
    <button class="tab-btn" onclick="switchTab('flow')">🚚 出貨流程</button>
    <button class="tab-btn" onclick="switchTab('recurring')">🔁 定期訂單</button>
  </div>

  <!-- ═══════════════ 開單 ═══════════════ -->
  <div id="tab-order" class="tab-pane active">

    <!-- 解析區 -->
    <div class="fc">
      <div class="fct">📩 貼入客戶訊息自動解析</div>
      <div class="parse-box">
        <textarea id="rawMsg" rows="5" placeholder="例如：&#10;台北市士林區中山北路七段191巷23號2樓&#10;廖渙傑&#10;0918455099&#10;仙草*6 杏仁*6&#10;ATM 下午到 週二寄"></textarea>
      </div>
      <div class="parse-actions">
        <button class="sbtn" style="background:var(--gray);height:34px;font-size:12px;" onclick="clearAll()">清除</button>
        <button class="sbtn g" style="height:34px;font-size:12px;" id="parseBtn" onclick="parseMessage()">✨ 自動解析</button>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <!-- 出貨資訊表單 -->
    <div class="fc">
      <div class="fct">📦 出貨資訊</div>

      <div class="fr one">
        <div id="wrap-address">
          <label class="ffl">收件地址</label>
          <input type="text" class="ffi" id="address" placeholder="完整地址">
        </div>
      </div>

      <div class="fr">
        <div id="wrap-name">
          <label class="ffl">收件姓名</label>
          <input type="text" class="ffi" id="name" placeholder="姓名">
        </div>
        <div id="wrap-phone">
          <label class="ffl">聯絡電話</label>
          <input type="text" class="ffi" id="phone" placeholder="電話號碼">
        </div>
      </div>

      <div class="fr">
        <div id="wrap-date">
          <label class="ffl">出貨日期</label>
          <input type="date" class="ffi" id="shipDate">
        </div>
        <div id="wrap-payment">
          <label class="ffl">付款方式</label>
          <select class="ffs" id="payment" onchange="onPaymentChange()">
            <option value="">請選擇</option>
            <option value="ATM">ATM 轉帳</option>
            <option value="貨到付款">貨到付款</option>
            <option value="LINE Pay">LINE Pay</option>
            <option value="現金">現金</option>
            <option value="不收款">不收款</option>
          </select>
        </div>
      </div>

      <!-- 金額欄（貨到付款才顯示） -->
      <div class="fr amount-row" id="amountRow">
        <div>
          <label class="ffl">收款金額（元）</label>
          <input type="number" class="ffi" id="amount" placeholder="0" min="0">
        </div>
        <div></div>
      </div>

      <!-- 品項 -->
      <div style="margin-bottom:10px;">
        <label class="ffl">出貨品項</label>
        <table class="items-table">
          <thead>
            <tr>
              <th style="width:44%">品項</th>
              <th style="width:22%">數量（罐）</th>
              <th style="width:22%">箱數換算</th>
              <th style="width:12%"></th>
            </tr>
          </thead>
          <tbody id="itemsBody"></tbody>
        </table>
        <div id="boxSummary"></div>
        <button class="sbtn" style="height:30px;font-size:12px;margin-top:6px;background:var(--gray);" onclick="addItemRow()">＋ 新增品項</button>
      </div>

      <div class="fr one">
        <div>
          <label class="ffl">備註</label>
          <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;align-items:center;">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
              <input type="checkbox" id="note_morning" onchange="syncNote()" style="width:16px;height:16px;accent-color:var(--teal);cursor:pointer;">早上到
            </label>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
              <input type="checkbox" id="note_afternoon" onchange="syncNote()" style="width:16px;height:16px;accent-color:var(--teal);cursor:pointer;">下午到
            </label>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
              <input type="checkbox" id="note_call" onchange="syncNote()" style="width:16px;height:16px;accent-color:var(--teal);cursor:pointer;">到貨前電聯
            </label>
          </div>
          <input type="text" class="ffi" id="note" placeholder="其他備註（選填）">
        </div>
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px;">
        <button class="sbtn" style="background:var(--gray);height:36px;" onclick="resetForm()">重填</button>
        <button class="sbtn g" style="height:36px;" onclick="submitOrder()">💾 確認送出</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════ 總表 ═══════════════ -->
  <div id="tab-summary" class="tab-pane">
    <div class="fc">
      <div class="period-bar">
        <button class="prd-btn active" id="btn-daily" onclick="switchPeriod('daily')">日報</button>
        <button class="prd-btn" id="btn-monthly" onclick="switchPeriod('monthly')">月報</button>
        <input type="date" id="filterDate" class="ffi" style="width:160px;height:34px;font-size:13px;" onchange="renderSummary()">
        <button class="sbtn g" style="height:34px;font-size:12px;" onclick="loadAndRender()">🔄 重新整理</button>
      </div>
      <div id="summaryContent"><div class="empty-tip">載入中…</div></div>
    </div>
  </div>

  <!-- ═══════════════ 品項設定 ═══════════════ -->
  <div id="tab-products" class="tab-pane">
    <div class="fc">
      <div class="fct">🏷️ 品項清單（解析時自動匹配）</div>
      <div id="prodList" style="margin-bottom:12px;"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
        <div>
          <label class="ffl">品項名稱</label>
          <input type="text" class="ffi" id="newProdName" placeholder="如：微糖仙草茶" style="width:150px;">
        </div>
        <div style="flex:1;min-width:180px;">
          <label class="ffl">別名（逗號分隔）</label>
          <input type="text" class="ffi" id="newProdAlias" placeholder="如：仙草,草茶,微糖">
        </div>
        <button class="sbtn g" style="height:38px;" onclick="addProduct()">＋ 新增</button>
      </div>
      <div style="margin-top:10px;font-size:12px;color:var(--text-m);">
        ⚠️ 品項設定儲存於 Google Sheets，所有裝置共用。
      </div>
    </div>
  </div>


  <!-- ═══════════════ 出貨流程 ═══════════════ -->
  <div id="tab-flow" class="tab-pane">

    <!-- LINE Token 設定 -->
    <div class="fc">
      <div class="fct">🔔 LINE 通知設定</div>
      <div class="line-token-box">
        <div style="font-size:12px;color:var(--text-m);margin-bottom:8px;">填入 LINE Notify Channel Access Token，步驟完成時自動推播通知到群組。</div>
        <div class="line-token-row">
          <div style="flex:1;min-width:200px;">
            <label class="ffl">Channel Access Token</label>
            <input type="password" class="ffi" id="lineToken" placeholder="填入後儲存即生效">
          </div>
          <button class="sbtn g" style="height:38px;" onclick="saveLineToken()">儲存</button>
          <button class="sbtn" style="height:38px;background:var(--gray);" onclick="testLineToken()">測試發送</button>
        </div>
        <div id="lineTokenStatus" style="font-size:12px;margin-top:6px;color:var(--text-m);"></div>
      </div>
    </div>

    <!-- 流程看板 -->
    <div class="fc">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
        <div style="font-size:13px;color:var(--text-m);">依出貨日期分組，每張訂單獨立追蹤</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="date" id="flowFilterDate" class="ffi" style="width:160px;height:34px;font-size:13px;" onchange="renderFlow()">
          <button class="sbtn g" style="height:34px;font-size:12px;" onclick="loadAndRenderFlow()">🔄 重新整理</button>
        </div>
      </div>
      <div id="flowContent"><div class="empty-tip">載入中…</div></div>
    </div>
  </div>


  <!-- ═══════════════ 定期訂單 ═══════════════ -->
  <div id="tab-recurring" class="tab-pane">
    <div class="fc">
      <div class="fct">🔁 定期訂單設定</div>
      <div style="font-size:12px;color:var(--text-m);margin-bottom:12px;">設定後每週自動建立出貨單，產生的訂單可在「開單」頁面修改或刪除。</div>

      <!-- 新增表單 -->
      <div style="background:var(--bg);border:1px solid var(--border-md);border-radius:var(--rs);padding:12px 14px;margin-bottom:14px;">
        <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;">＋ 新增定期客戶</div>
        <div class="fr">
          <div>
            <label class="ffl">客戶姓名</label>
            <input type="text" class="ffi" id="rc-name" placeholder="姓名">
          </div>
          <div>
            <label class="ffl">聯絡電話</label>
            <input type="text" class="ffi" id="rc-phone" placeholder="電話號碼">
          </div>
        </div>
        <div class="fr one">
          <div>
            <label class="ffl">收件地址</label>
            <input type="text" class="ffi" id="rc-address" placeholder="完整地址">
          </div>
        </div>
        <div class="fr">
          <div>
            <label class="ffl">付款方式</label>
            <select class="ffs" id="rc-payment">
              <option value="ATM">ATM 轉帳</option>
              <option value="貨到付款">貨到付款</option>
              <option value="LINE Pay">LINE Pay</option>
              <option value="現金">現金</option>
              <option value="不收款">不收款</option>
            </select>
          </div>
          <div>
            <label class="ffl">備註</label>
            <input type="text" class="ffi" id="rc-note" placeholder="選填">
          </div>
        </div>

        <!-- 出貨品項 -->
        <div style="margin:8px 0;">
          <label class="ffl">出貨品項</label>
          <table class="items-table">
            <thead><tr>
              <th style="width:50%">品項</th>
              <th style="width:25%">數量（罐）</th>
              <th style="width:25%"></th>
            </tr></thead>
            <tbody id="rc-itemsBody"></tbody>
          </table>
          <button class="sbtn" style="height:28px;font-size:12px;margin-top:4px;background:var(--gray);" onclick="addRcItemRow()">＋ 新增品項</button>
        </div>

        <!-- 出貨星期 -->
        <div style="margin-bottom:10px;">
          <label class="ffl">出貨星期（可多選）</label>
          <div class="recur-days" id="rc-days">
            <button type="button" class="day-pill" data-day="1" onclick="toggleDay(this)">週一</button>
            <button type="button" class="day-pill" data-day="2" onclick="toggleDay(this)">週二</button>
            <button type="button" class="day-pill" data-day="3" onclick="toggleDay(this)">週三</button>
            <button type="button" class="day-pill" data-day="4" onclick="toggleDay(this)">週四</button>

<script>

// 狀態

var PRODUCTS = [];
var currentPeriod = 'daily';

// ════════════════════════════════════════
// 初始化
// ════════════════════════════════════════
window.addEventListener('load', async () => {

// 分頁切換

function switchTab(name) {

  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

// ════════════════════════════════════════
// 付款方式
// ════════════════════════════════════════
function onPaymentChange() {
  var v = gv('payment');
  var row = document.getElementById('amountRow');
  row.style.display = (v === '貨到付款') ? 'grid' : 'none';
  if (v !== '貨到付款') sv('amount', '');
}

// ════════════════════════════════════════
// 品項列操作
// ════════════════════════════════════════
function getProductOptions(selected) {
  return PRODUCTS.map(p =>
    `<option value="${p.name}"${p.name === selected ? ' selected' : ''}>${p.name}</option>`
  ).join('');
}

function addItemRow(name, qty) {
  var tbody = document.getElementById('itemsBody');
  var tr = document.createElement('tr');
  var qtyVal = qty || '';
  tr.innerHTML = `
    <td><select onchange="updateBoxes(this)">${getProductOptions(name)}</select></td>
    <td><input type="number" min="0" value="${qtyVal}" placeholder="0" oninput="updateBoxes(this)" style="width:70px;"></td>
    <td class="box-cell"></td>
    <td><button class="del-btn" onclick="this.closest('tr').remove();updateTotalBoxes()">✕</button></td>`;
  if (qty) {
    var bc = tr.querySelector('.box-cell');
    bc.textContent = calcBoxText(parseInt(qty));
  }
  tbody.appendChild(tr);
  updateTotalBoxes();
}

function calcBoxText(qty) {
  if (!qty || qty <= 0) return '';
  var b = Math.floor(qty / 12), r = qty % 12;
  if (b > 0 && r > 0) return b + '箱' + r + '罐';
  if (b > 0) return b + '箱';
  return r + '罐';
}

function updateBoxes(el) {
  var row = el.closest('tr');
  var qty = parseInt(row.querySelector('input[type=number]').value) || 0;
  row.querySelector('.box-cell').textContent = calcBoxText(qty);
  updateTotalBoxes();
}

function updateTotalBoxes() {
  var total = 0;
  document.querySelectorAll('#itemsBody input[type=number]').forEach(inp => {
    total += parseInt(inp.value) || 0;
  });
  var el = document.getElementById('boxSummary');
  if (total > 0) {
    el.innerHTML = `<div class="box-badge">📦 共 ${calcBoxText(total)}（${total} 罐）</div>`;
  } else {
    el.innerHTML = '';
  }
}

function getItemRows() {
  return [...document.querySelectorAll('#itemsBody tr')].map(tr => {
    var sel = tr.querySelector('select');
    var inp = tr.querySelector('input[type=number]');
    return { name: sel ? sel.value : '', qty: parseInt(inp ? inp.value : 0) || 0 };
  }).filter(it => it.qty > 0);
}

// ════════════════════════════════════════
// 品項解析邏輯
// ════════════════════════════════════════
function matchProduct(text) {
  // 先用完整文字比對（含無糖/微糖等修飾詞），別名越長的越優先
  var sorted = [...PRODUCTS].sort((a, b) => {
    var maxA = Math.max(...a.aliases.map(x => x.length));
    var maxB = Math.max(...b.aliases.map(x => x.length));
    return maxB - maxA;
  });
  for (var p of sorted) {
    for (var alias of p.aliases) {
      if (text.includes(alias)) return p.name;
    }
  }
  return PRODUCTS[0] ? PRODUCTS[0].name : '';
}

function getNextWeekday(dayName) {
  var days = { '日': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6 };
  var target = days[dayName];
  if (target === undefined) return null;
  var now = new Date();
  var diff = target - now.getDay();
  if (diff <= 0) diff += 7;
  var r = new Date(now);
  r.setDate(now.getDate() + diff);
  return r.toISOString().slice(0, 10);
}

function localParse(raw) {
  var result = { address: '', name: '', phone: '', items: [], shipDate: '', payment: '', note: '' };
  var lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  var usedIdx = new Set();

  lines.forEach((line, i) => {
    if (/^09\d{8}$/.test(line.replace(/[-\s]/g, ''))) {
      result.phone = line.replace(/[-\s]/g, ''); usedIdx.add(i);
    } else if (/[縣市區鄉鎮村里街路巷弄號樓]/.test(line) && !result.address) {
      result.address = line; usedIdx.add(i);
    } else if (/^[\u4e00-\u9fa5]{2,4}$/.test(line) && !result.name) {
      result.name = line; usedIdx.add(i);
    }
  });

  // 品項解析：支援 仙草茶無糖12瓶 / 仙草*6 / 仙草x6 / 仙草6罐 / 仙草（6）
  // pattern 會捕捉「品項文字（含無糖/微糖修飾）」+ 數量
  var itemPatterns = [
    // 品項文字 * 數字，如「仙草茶無糖*12」「仙草*6」
    /([\u4e00-\u9fa5a-zA-Z]+)\s*[\*x×]\s*(\d+)/g,
    // 品項文字 數字 單位，如「仙草茶無糖12瓶」「仙草6罐」
    /([\u4e00-\u9fa5a-zA-Z]+)\s*(\d+)\s*(?:罐|瓶|盒|箱|包|平)/g,
    // 品項文字（數字），如「仙草（6）」
    /([\u4e00-\u9fa5a-zA-Z]+)（(\d+)）/g,
  ];
  lines.forEach((line, i) => {
    var found = false;
    for (var pat of itemPatterns) {
      pat.lastIndex = 0;
      var m;
      while ((m = pat.exec(line)) !== null) {
        // m[1] 是品項關鍵字（含無糖/微糖），傳完整字串比對
        var pname = matchProduct(m[1]);
        var qty = parseInt(m[2]);
        if (qty > 0) { result.items.push({ name: pname, qty }); found = true; }
      }
      if (found) break;
    }
    if (found) usedIdx.add(i);
  });

  var fullText = raw;
  if (/ATM/i.test(fullText)) result.payment = 'ATM';
  else if (/貨到付款|取貨付款/.test(fullText)) result.payment = '貨到付款';
  else if (/LINE\s*Pay/i.test(fullText)) result.payment = 'LINE Pay';
  else if (/不收款/.test(fullText)) result.payment = '不收款';
  else if (/現金/.test(fullText)) result.payment = '現金';

  var wm = fullText.match(/週([一二三四五六日])/);
  if (wm) result.shipDate = getNextWeekday(wm[1]) || '';

  var notes = [];
  lines.forEach((line, i) => {
    if (usedIdx.has(i)) return;
    if (/ATM|LINE\s*Pay|貨到付款|不收款|現金|週[一二三四五六日]/i.test(line)) return;
    notes.push(line);
  });
  result.note = notes.join(' ').trim();
  return result;
}

// ════════════════════════════════════════
// 自動解析（AI + 本地備援）
// ════════════════════════════════════════
async function parseMessage() {
  var raw = gv('rawMsg').trim();
  if (!raw) { toast('請先貼入客戶訊息', 'er'); return; }
  var btn = document.getElementById('parseBtn');
  btn.disabled = true;
  setStatus('<span class="spin"></span> 解析中…');

  var todayStr = new Date().toISOString().slice(0, 10);
  var prodList = PRODUCTS.map(p => p.name + '（別名：' + p.aliases.join('、') + '）').join('；');

  try {
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: `從客戶訊息提取宅配資訊，只回傳JSON不要任何說明。
品項清單：${prodList}
注意：「無糖」和「微糖」是不同品項，請仔細區分，並以完整品項名稱（如「無糖仙草茶」vs「微糖仙草茶」）回傳。
今天：${todayStr}，週X請推算最近的那天。
回傳格式：{"address":"","name":"","phone":"","items":[{"name":"需完全符合品項清單名稱","qty":數量}],"shipDate":"YYYY-MM-DD或空","payment":"ATM或貨到付款或LINE Pay或不收款或現金或空","note":""}
客戶訊息：\n${raw}` }]
      })
    });
    if (!res.ok) throw new Error('api_fail');
    var data = await res.json();
    var text = (data.content || []).find(c => c.type === 'text')?.text || '';
    var parsed = JSON.parse(text.replace(/```json|```/g, '').trim());
    applyParsed(parsed, false);
  } catch (e) {
    applyParsed(localParse(raw), true);
  }
  btn.disabled = false;
}

function applyParsed(parsed, isFallback) {
  var filled = 0;
  var fields = ['address', 'name', 'phone', 'date', 'payment'];

  function setField(wrapId, inputId, val) {
    var wrap = document.getElementById(wrapId);
    if (val) { sv(inputId, val); wrap.classList.add('hl'); filled++; }
    else wrap.classList.remove('hl');
  }

  setField('wrap-address', 'address', parsed.address);
  setField('wrap-name', 'name', parsed.name);
  setField('wrap-phone', 'phone', parsed.phone);
  setField('wrap-date', 'shipDate', parsed.shipDate);
  if (parsed.payment) {
    setField('wrap-payment', 'payment', parsed.payment);
    onPaymentChange();
  } else {
    document.getElementById('wrap-payment').classList.remove('hl');
  }
  if (parsed.note) {
    var noteText = parsed.note;
    // 自動勾選快選項
    if (/早上到/.test(noteText)) { document.getElementById('note_morning').checked = true; noteText = noteText.replace(/早上到[、,，]?/g, '').trim(); }
    if (/下午到/.test(noteText)) { document.getElementById('note_afternoon').checked = true; noteText = noteText.replace(/下午到[、,，]?/g, '').trim(); }
    if (/到貨前電聯|電聯/.test(noteText)) { document.getElementById('note_call').checked = true; noteText = noteText.replace(/到貨前電聯[、,，]?|電聯[、,，]?/g, '').trim(); }
    sv('note', noteText);
    filled++;
  }

  document.getElementById('itemsBody').innerHTML = '';
  if (parsed.items && parsed.items.length > 0) {
    parsed.items.forEach(it => addItemRow(it.name, it.qty));
    filled++;
  } else {
    addItemRow();
  }

  var label = isFallback ? '規則解析' : 'AI 解析';
  setStatus(`✓ ${label}完成，填入 ${filled} 個欄位，請確認後修改`, 'ok');
}

function setStatus(html, cls) {
  var el = document.getElementById('statusMsg');
  el.innerHTML = html;
  el.className = 'status-msg' + (cls ? ' ' + cls : '');
}

// ════════════════════════════════════════
// 送出
// ════════════════════════════════════════
async function submitOrder() {
  var address = gv('address').trim();
  var name = gv('name').trim();
  var phone = gv('phone').trim();
  if (!address || !name || !phone) { toast('請填寫地址、姓名、電話', 'er'); return; }
  var items = getItemRows();
  if (items.length === 0) { toast('請至少填寫一個出貨品項', 'er'); return; }

  var payment = gv('payment');
  var amount = payment === '貨到付款' ? (parseInt(gv('amount')) || 0) : '';
  var shipDate = gv('shipDate') || today;

  toast('儲存中…');
  var r = await api({
    action: 'deliverySave',
    address, name, phone, shipDate, payment,
    amount: String(amount),
    note: getNoteValue(),
    items: JSON.stringify(items),
    rawMsg: gv('rawMsg').trim()
  });
  if (r.ok) {
    toast('✓ 出貨單已建立', 'ok');
    // 操作紀錄
    var u = JSON.parse(sessionStorage.getItem('longyinUser') || '{}');
    await api({ action: 'logSave', user: u.name || '', role: u.role || '', action: '新增', module: '宅配出貨', detail: name + ' ' + items.map(i => i.name + 'x' + i.qty).join('、') });
    resetForm();
  } else {
    toast('✗ ' + (r.error || '儲存失敗'), 'er');
  }
}

function clearAll() {
  sv('rawMsg', '');
  resetForm();
  setStatus('');
}

function syncNote() {
  // 把勾選項目組合進 note 欄（顯示用），送出時再合併
}

function getNoteValue() {
  var checks = [];
  if (document.getElementById('note_morning').checked) checks.push('早上到');
  if (document.getElementById('note_afternoon').checked) checks.push('下午到');
  if (document.getElementById('note_call').checked) checks.push('到貨前電聯');
  var extra = document.getElementById('note').value.trim();
  if (extra) checks.push(extra);
  return checks.join('、');
}

function resetForm() {
  ['address', 'name', 'phone', 'note', 'amount'].forEach(id => sv(id, ''));
  sv('shipDate', today);
  sv('payment', '');
  document.getElementById('note_morning').checked = false;
  document.getElementById('note_afternoon').checked = false;
  document.getElementById('note_call').checked = false;
  document.getElementById('amountRow').style.display = 'none';
  document.getElementById('itemsBody').innerHTML = '';
  document.getElementById('boxSummary').innerHTML = '';
  ['wrap-address', 'wrap-name', 'wrap-phone', 'wrap-date', 'wrap-payment'].forEach(id => {
    document.getElementById(id).classList.remove('hl');
  });
  setStatus('');
  addItemRow();
}

// ════════════════════════════════════════
// 總表
// ════════════════════════════════════════
function switchPeriod(p) {
  currentPeriod = p;
  document.getElementById('btn-daily').classList.toggle('active', p === 'daily');
  document.getElementById('btn-monthly').classList.toggle('active', p === 'monthly');
  var fi = document.getElementById('filterDate');
  if (p === 'monthly') { fi.type = 'month'; fi.value = today.slice(0, 7); }
  else { fi.type = 'date'; fi.value = today; }
  renderSummary();
}

async function loadAndRender() {
  document.getElementById('summaryContent').innerHTML = '<div class="empty-tip">載入中…</div>';
  var r = await api({ action: 'deliveryGetAll' });
  if (!r.ok) { document.getElementById('summaryContent').innerHTML = '<div class="empty-tip">載入失敗</div>'; return; }
  window._orders = r.data || [];
  renderSummary();
}

function renderSummary() {
  var orders = window._orders || [];
  var filterVal = gv('filterDate');
  var filtered = orders;
  if (filterVal) {
    if (currentPeriod === 'daily') filtered = orders.filter(o => o.shipDate === filterVal);
    else filtered = orders.filter(o => o.shipDate && o.shipDate.startsWith(filterVal));
  }

  var container = document.getElementById('summaryContent');
  if (!filtered.length) {
    container.innerHTML = '<div class="empty-tip">此期間無出貨記錄</div>';
    return;
  }

  var totalQty = 0;
  var itemTotals = {};
  filtered.forEach(o => {
    var items = [];
    try { items = JSON.parse(o.items || '[]'); } catch (e) {}
    items.forEach(it => {
      totalQty += it.qty;
      itemTotals[it.name] = (itemTotals[it.name] || 0) + it.qty;
    });
  });

  var html = `<div class="stat-row">
    <div class="stat-card"><div class="sc-label">出貨單數</div><div class="sc-val">${filtered.length}</div><div class="sc-sub">張</div></div>
    <div class="stat-card"><div class="sc-label">總出貨量</div><div class="sc-val">${totalQty}</div><div class="sc-sub">罐 ≈ ${calcBoxText(totalQty)}</div></div>
  </div>`;

  // 品項分解
  html += `<table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:1rem;">
    <thead><tr><th style="padding:5px 8px;border-bottom:1px solid var(--border);text-align:left;color:var(--text-m);">品項</th><th style="padding:5px 8px;border-bottom:1px solid var(--border);text-align:left;color:var(--text-m);">數量</th><th style="padding:5px 8px;border-bottom:1px solid var(--border);text-align:left;color:var(--text-m);">換算</th></tr></thead><tbody>`;
  Object.entries(itemTotals).sort((a, b) => b[1] - a[1]).forEach(([name, qty]) => {
    html += `<tr><td style="padding:5px 8px;border-bottom:1px solid var(--border);">${name}</td><td style="padding:5px 8px;border-bottom:1px solid var(--border);">${qty} 罐</td><td style="padding:5px 8px;border-bottom:1px solid var(--border);color:var(--teal);font-weight:600;">${calcBoxText(qty)}</td></tr>`;
  });
  html += `</tbody></table>`;

  html += `<div style="font-size:12px;font-weight:600;color:var(--text-m);margin-bottom:8px;">出貨明細</div>`;
  filtered.forEach(o => {
    var items = [];
    try { items = JSON.parse(o.items || '[]'); } catch (e) {}
    var qty = items.reduce((s, i) => s + i.qty, 0);
    var itemStr = items.map(i => i.name + ' ×' + i.qty).join('、');
    var payStr = o.payment + (o.amount && o.amount !== '0' ? '  $' + o.amount : '');
    html += `<div class="order-card">
      <div class="oc-head">
        <div>
          <div class="oc-name">${o.name}</div>
          <div class="oc-date">${o.shipDate} &nbsp; ${o.phone}</div>
        </div>
        <button class="del-btn" onclick="deleteOrder('${o.id}')">刪除</button>
      </div>
      <div class="oc-items">${o.address}</div>
      <div class="oc-items" style="margin-top:3px;">${itemStr}</div>
      <div style="margin-top:4px;">
        <span class="oc-box">📦 ${calcBoxText(qty)}</span>
      </div>
      <div class="oc-pay">${payStr}${o.note ? '・' + o.note : ''}</div>
    </div>`;
  });

  container.innerHTML = html;
}

async function deleteOrder(id) {
  if (!confirm('確定要刪除這筆出貨單？')) return;
  var r = await api({ action: 'deliveryDelete', id });
  if (r.ok) { toast('已刪除', 'ok'); loadAndRender(); }
  else toast('刪除失敗', 'er');
}

// ════════════════════════════════════════
// 品項設定
// ════════════════════════════════════════
async function loadProducts() {
  var r = await api({ action: 'deliveryProductsGet' });
  if (r.ok && r.data && r.data.length > 0) {
    PRODUCTS = r.data;
  } else {
    // 預設品項
    PRODUCTS = [
      { name: '微糖仙草茶', aliases: ['仙草', '仙草茶', '草茶', '微糖仙草'] },
      { name: '無糖仙草茶', aliases: ['無糖仙草', '無糖草茶', '仙草無糖', '仙草茶無糖'] },
      { name: '杏仁茶',    aliases: ['杏仁', '杏仁茶'] },
      { name: '大杏仁粉',  aliases: ['大杏仁粉', '大杏仁', '大杏'] },
      { name: '小杏仁粉',  aliases: ['小杏仁粉', '小杏仁', '小杏'] },
    ];
  }
}

function renderProducts() {
  var list = document.getElementById('prodList');
  if (!PRODUCTS.length) { list.innerHTML = '<div style="color:var(--text-h);font-size:13px;">尚無品項，請新增</div>'; return; }
  list.innerHTML = PRODUCTS.map((p, i) => `
    <div class="prod-row">
      <span class="prod-name">${p.name}</span>
      <span class="prod-alias">別名：${p.aliases.join('、')}</span>
      <button class="del-btn" onclick="deleteProduct(${i})">刪除</button>
    </div>`).join('');
}

async function addProduct() {
  var name = gv('newProdName').trim();
  var aliasStr = gv('newProdAlias').trim();
  if (!name) { toast('請輸入品項名稱', 'er'); return; }
  var aliases = aliasStr ? aliasStr.split(/[,，]/).map(a => a.trim()).filter(Boolean) : [];
  if (!aliases.includes(name)) aliases.unshift(name);
  PRODUCTS.push({ name, aliases });
  var r = await api({ action: 'deliveryProductsSave', products: JSON.stringify(PRODUCTS) });
  if (r.ok) {
    sv('newProdName', ''); sv('newProdAlias', '');
    renderProducts();
    toast('品項已新增', 'ok');
  } else {
    PRODUCTS.pop();
    toast('儲存失敗', 'er');
  }
}

async function deleteProduct(idx) {
  if (!confirm('確定刪除「' + PRODUCTS[idx].name + '」？')) return;
  PRODUCTS.splice(idx, 1);
  var r = await api({ action: 'deliveryProductsSave', products: JSON.stringify(PRODUCTS) });
  if (r.ok) { renderProducts(); toast('已刪除', 'ok'); }
  else toast('刪除失敗', 'er');
}


// ════════════════════════════════════════════════════════
// 出貨流程 – 步驟定義
// ════════════════════════════════════════════════════════
var FLOW_STEPS = [
  { key:'confirmed',  emoji:'✅', label:'已確認',     notify:true,  notifyMsg: name => `✅ 龍吟出貨｜${name} 已確認，準備製作` },
  { key:'produced',   emoji:'🍵', label:'已製作',     notify:false },
  { key:'photo',      emoji:'📷', label:'封箱前拍照', notify:false, hasPhoto:true },
  { key:'packed',     emoji:'📦', label:'已打包',     notify:false },
  { key:'filled',     emoji:'📋', label:'已填單',     notify:false },
  { key:'called',     emoji:'📞', label:'已致電',     notify:true,  notifyMsg: name => `📞 龍吟出貨｜${name} 已致電宅配，等待取件` },
  { key:'picked',     emoji:'🚚', label:'已取件',     notify:true,  notifyMsg: name => `🚚 龍吟出貨｜${name} 已取件完成！` },
];

// ════════════════════════════════════════
// LINE Token
// ════════════════════════════════════════
function getLineToken() {
  return document.getElementById('lineToken').value.trim() || localStorage.getItem('lw_line_token') || '';
}

function saveLineToken() {
  var t = document.getElementById('lineToken').value.trim();
  if (!t) { document.getElementById('lineTokenStatus').innerHTML = '<span style="color:var(--red)">請輸入 Token</span>'; return; }
  localStorage.setItem('lw_line_token', t);
  document.getElementById('lineTokenStatus').innerHTML = '<span style="color:var(--teal)">✓ 已儲存</span>';
}

async function testLineToken() {
  var r = await api({ action: 'lineNotify', message: '✅ 龍吟出貨通知測試成功！龍吟出貨系統已串接 LINE。' });
  if (r.ok) {
    toast('測試通知已發送', 'ok');
    document.getElementById('lineTokenStatus').innerHTML = '<span style="color:var(--teal)">✓ 通知發送成功</span>';
  } else {
    toast('發送失敗：' + (r.error || ''), 'er');
    document.getElementById('lineTokenStatus').innerHTML = '<span style="color:var(--red)">✗ ' + (r.error || '失敗') + '</span>';
  }
}

async function sendLineNotify(message) {
  await api({ action: 'lineNotify', message });
}

// ════════════════════════════════════════
// 流程狀態讀寫（存 Sheets）
// ════════════════════════════════════════
var _flowCache = {}; // orderId → steps obj

async function loadFlowState(orderId) {
  if (_flowCache[orderId]) return _flowCache[orderId];
  var r = await api({ action: 'deliveryFlowGet', orderId });
  var state = (r.ok && r.data) ? r.data : {};
  _flowCache[orderId] = state;
  return state;
}

async function saveFlowState(orderId, state) {
  _flowCache[orderId] = state;
  await api({ action: 'deliveryFlowSave', orderId, state: JSON.stringify(state) });
}

// ════════════════════════════════════════
// 載入並渲染流程看板
// ════════════════════════════════════════
async function loadAndRenderFlow() {
  document.getElementById('flowContent').innerHTML = '<div class="empty-tip">載入中…</div>';
  _flowCache = {};
  var r = await api({ action: 'deliveryGetAll' });
  window._orders = r.ok ? (r.data || []) : [];
  await renderFlow();
}

async function renderFlow() {
  var filterDate = document.getElementById('flowFilterDate').value;
  var orders = (window._orders || []).filter(o => !filterDate || o.shipDate === filterDate);
  var container = document.getElementById('flowContent');

  if (!orders.length) {
    container.innerHTML = '<div class="empty-tip">此日期無出貨訂單</div>';
    return;
  }

  // 依出貨日期分組
  var groups = {};
  orders.forEach(o => {
    if (!groups[o.shipDate]) groups[o.shipDate] = [];
    groups[o.shipDate].push(o);
  });

  // 預載所有流程狀態
  for (var o of orders) {
    await loadFlowState(o.id);
  }

  var html = '';
  var sortedDates = Object.keys(groups).sort();
  for (var date of sortedDates) {
    var dayOrders = groups[date];
    var totalSteps = dayOrders.length * FLOW_STEPS.length;
    var doneSteps = dayOrders.reduce((s, o) => {
      var state = _flowCache[o.id] || {};
      return s + FLOW_STEPS.filter(st => state[st.key]).length;
    }, 0);

    html += `<div class="flow-date-group">
      <div class="flow-date-label">📅 ${date} <span>${dayOrders.length} 張訂單</span>
        <div style="flex:1;"></div>
        <div class="flow-card-progress" style="min-width:120px;">
          <div class="flow-prog-bar"><div class="flow-prog-fill" style="width:${Math.round(doneSteps/totalSteps*100)}%"></div></div>
          <span class="flow-prog-txt">${doneSteps}/${totalSteps}</span>
        </div>
      </div>
      <div class="flow-cards">`;

    for (var order of dayOrders) {
      var state = _flowCache[order.id] || {};
      var items = [];
      try { items = JSON.parse(order.items || '[]'); } catch(e) {}
      var itemStr = items.map(i => i.name + '×' + i.qty).join('、');
      var doneCount = FLOW_STEPS.filter(st => state[st.key]).length;
      var prog = Math.round(doneCount / FLOW_STEPS.length * 100);
      var allDone = doneCount === FLOW_STEPS.length;

      html += `<div class="flow-card" id="fc-${order.id}">
        <div class="flow-card-head">
          <div>
            <div class="flow-card-name">${order.name} ${allDone ? '<span style="font-size:11px;background:#E8F5E9;color:#2E7D32;border-radius:20px;padding:1px 8px;">完成</span>' : ''}</div>
            <div class="flow-card-meta">${order.phone} ・ ${itemStr} ・ ${order.payment}</div>
          </div>
          <div class="flow-card-progress">
            <div class="flow-prog-bar" style="min-width:80px;"><div class="flow-prog-fill" style="width:${prog}%"></div></div>
            <span class="flow-prog-txt">${doneCount}/${FLOW_STEPS.length}</span>
          </div>
        </div>
        <div class="flow-steps">`;

      FLOW_STEPS.forEach((step, idx) => {
        var done = !!state[step.key];
        var doneTime = state[step.key + '_time'] || '';
        var photos = state[step.key + '_photos'] || [];
        var notifyBadge = step.notify ? '<span class="flow-step-notify">LINE 通知</span>' : '';

        html += `<div class="flow-step${done ? ' done' : ''}" id="fs-${order.id}-${step.key}">
          <div class="flow-step-check" onclick="toggleStep('${order.id}','${step.key}','${order.name}','${date}')">${done ? '✓' : ''}</div>
          <div class="flow-step-body">
            <div class="flow-step-label">${step.emoji} ${step.label} ${notifyBadge}</div>
            ${doneTime ? `<div class="flow-step-time">完成時間：${doneTime}</div>` : ''}
            ${step.hasPhoto ? `<div class="flow-step-photo">
              <div class="photo-list" id="photos-${order.id}">
                ${photos.map(p => `<img src="${p}" class="photo-thumb" onclick="viewPhoto('${p}')">`).join('')}
              </div>
              <label class="photo-upload-area" style="margin-top:${photos.length?'6':'0'}px;">
                <input type="file" accept="image/*" multiple style="display:none;" onchange="uploadPhotos(this,'${order.id}')">
                📷 點此上傳照片
              </label>
            </div>` : ''}
          </div>
        </div>`;
      });

      html += `</div></div>`;
    }
    html += `</div></div>`;
  }

  container.innerHTML = html;
}

// ════════════════════════════════════════
// 切換步驟
// ════════════════════════════════════════
async function toggleStep(orderId, stepKey, orderName, shipDate) {
  var state = await loadFlowState(orderId);
  var wasDone = !!state[stepKey];
  state[stepKey] = !wasDone;
  if (!wasDone) {
    // 標記完成時間
    var now = new Date();
    state[stepKey + '_time'] = now.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
    // 發送 LINE 通知
    var stepDef = FLOW_STEPS.find(s => s.key === stepKey);
    if (stepDef && stepDef.notify && stepDef.notifyMsg) {
      sendLineNotify(stepDef.notifyMsg(orderName) + '
📅 出貨日：' + shipDate);
    }
  } else {
    delete state[stepKey + '_time'];
  }
  await saveFlowState(orderId, state);
  // 只更新這張卡的 DOM，不重新載入全部
  await refreshFlowCard(orderId, orderName, shipDate);
}

async function refreshFlowCard(orderId, orderName, shipDate) {
  // 重新讀取並更新單張卡
  var r = await api({ action: 'deliveryGetAll' });
  window._orders = r.ok ? (r.data || []) : [];
  _flowCache[orderId] = null; // 清快取
  await renderFlow();
}

// ════════════════════════════════════════
// 照片上傳
// ════════════════════════════════════════
async function uploadPhotos(input, orderId) {
  var files = Array.from(input.files);
  if (!files.length) return;
  toast('上傳中…');

  var state = await loadFlowState(orderId);
  if (!state['photo_photos']) state['photo_photos'] = [];

  for (var file of files) {
    var b64 = await new Promise((res, rej) => {
      var r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    // 儲存到 Apps Script（base64）
    var resp = await api({ action: 'deliveryPhotoSave', orderId, photo: b64 });
    if (resp.ok && resp.url) {
      state['photo_photos'].push(resp.url);
    }
  }

  await saveFlowState(orderId, state);
  toast('照片已上傳', 'ok');
  await renderFlow();
}

function viewPhoto(url) {
  window.open(url, '_blank');
}

// ════════════════════════════════════════
// 16-18 點取件提醒
// ════════════════════════════════════════
var _lastReminderHour = -1;

function startPickupReminder() {
  setInterval(checkPickupReminder, 60000); // 每分鐘檢查
  checkPickupReminder();
}

async function checkPickupReminder() {
  var now = new Date();
  var h = now.getHours();
  var m = now.getMinutes();
  // 只在 16、17、18 點的 0-5 分內觸發，且每小時只觸發一次
  if (h < 16 || h > 18) return;
  if (m > 5) return;
  if (_lastReminderHour === h) return;

  // 取得今天的訂單，找出尚未取件的
  var todayStr = new Date().toISOString().slice(0, 10);
  var orders = (window._orders || []).filter(o => o.shipDate === todayStr);
  if (!orders.length) return;

  var unpicked = [];
  for (var o of orders) {
    var state = await loadFlowState(o.id);
    if (!state['picked']) unpicked.push(o.name);
  }

  if (unpicked.length > 0) {
    _lastReminderHour = h;
    var msg = `⏰ ${h}:00 提醒｜以下訂單尚未取件，請確認：
` + unpicked.map(n => '・' + n).join('
');
    // 頁面通知
    if (Notification && Notification.permission === 'granted') {
      new Notification('龍吟出貨提醒', { body: unpicked.join('、') + ' 尚未取件', icon: '🚚' });
    } else if (Notification && Notification.permission !== 'denied') {
      Notification.requestPermission();
    }
    toast('⏰ ' + unpicked.length + ' 張訂單尚未取件！', 'er');
    // 發送 LINE 群組通知
    sendLineNotify(msg);
  }
}


// ════════════════════════════════════════════════════════
// 定期訂單
// ════════════════════════════════════════════════════════
var DAY_NAMES = ['週日','週一','週二','週三','週四','週五','週六'];

function toggleDay(btn) {
  btn.classList.toggle('on');
}

function addRcItemRow(name, qty) {
  var tbody = document.getElementById('rc-itemsBody');
  var tr = document.createElement('tr');
  tr.innerHTML = `
    <td><select>${getProductOptions(name)}</select></td>
    <td><input type="number" min="1" value="${qty||12}" style="width:70px;"></td>
    <td><button class="del-btn" onclick="this.closest('tr').remove()">✕</button></td>`;
  tbody.appendChild(tr);
}

function getRcItemRows() {
  return [...document.querySelectorAll('#rc-itemsBody tr')].map(tr => {
    var sel = tr.querySelector('select');
    var inp = tr.querySelector('input[type=number]');
    return { name: sel ? sel.value : '', qty: parseInt(inp ? inp.value : 12) || 12 };
  }).filter(it => it.qty > 0);
}

function getSelectedDays() {
  return [...document.querySelectorAll('#rc-days .day-pill.on')].map(b => parseInt(b.dataset.day));
}

async function saveRecurring() {
  var name = gv('rc-name').trim();
  var phone = gv('rc-phone').trim();
  var address = gv('rc-address').trim();
  if (!name || !phone || !address) { toast('請填寫姓名、電話、地址', 'er'); return; }
  var items = getRcItemRows();
  if (!items.length) { toast('請至少填寫一個出貨品項', 'er'); return; }
  var days = getSelectedDays();
  if (!days.length) { toast('請選擇至少一個出貨星期', 'er'); return; }

  var rec = {
    id: Date.now(),
    name, phone, address,
    payment: gv('rc-payment'),
    note: gv('rc-note').trim(),
    items: JSON.stringify(items),
    days: JSON.stringify(days),
    active: true,
    createdAt: new Date().toISOString().slice(0,10)
  };

  var r = await api({ action: 'recurringOrderSave', ...rec, items: rec.items, days: rec.days });
  if (r.ok) {
    toast('✓ 定期訂單已儲存', 'ok');
    // 清空表單
    ['rc-name','rc-phone','rc-address','rc-note'].forEach(id => sv(id, ''));
    sv('rc-payment', 'ATM');
    document.getElementById('rc-itemsBody').innerHTML = '';
    document.querySelectorAll('#rc-days .day-pill').forEach(b => b.classList.remove('on'));
    addRcItemRow();
    loadRecurring();
  } else {
    toast('儲存失敗：' + (r.error||''), 'er');
  }
}

async function loadRecurring() {
  var r = await api({ action: 'recurringOrderGetAll' });
  renderRecurring(r.ok ? (r.data||[]) : []);
}

function renderRecurring(list) {
  var el = document.getElementById('recurringList');
  if (!list.length) {
    el.innerHTML = '<div class="empty-tip">尚無定期訂單，請新增</div>';
    return;
  }
  el.innerHTML = list.map(rec => {
    var items = [];
    try { items = JSON.parse(rec.items||'[]'); } catch(e){}
    var days = [];
    try { days = JSON.parse(rec.days||'[]'); } catch(e){}
    var itemStr = items.map(i => i.name + ' ×' + i.qty + '（' + calcBoxText(i.qty) + '）').join('、');
    var dayStr = days.sort((a,b)=>a-b).map(d => DAY_NAMES[d]).join('・');
    var totalQty = items.reduce((s,i) => s+i.qty, 0);
    var isActive = rec.active === 'true' || rec.active === true;
    return `<div class="recur-card" style="${isActive ? '' : 'opacity:.5'}">
      <div class="recur-head">
        <div>
          <div class="recur-name">${rec.name}
            <span style="font-size:11px;${isActive ? 'background:#E8F5E9;color:#2E7D32' : 'background:#F5F5F5;color:#999'};border-radius:20px;padding:1px 8px;margin-left:4px;font-weight:500;">
              ${isActive ? '啟用中' : '已停用'}
            </span>
          </div>
          <div class="recur-meta">${rec.phone} ・ ${rec.address}</div>
          <div class="recur-meta" style="margin-top:3px;">${itemStr}</div>
          <div class="recur-meta" style="margin-top:2px;">📦 共 ${calcBoxText(totalQty)} ・ 每 ${dayStr} 出貨 ・ ${rec.payment}</div>
        </div>
        <div class="recur-actions">
          <button class="del-btn" onclick="toggleRecurring('${rec.id}')">${isActive ? '停用' : '啟用'}</button>
          <button class="del-btn" onclick="deleteRecurring('${rec.id}')">刪除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function toggleRecurring(id) {
  var r = await api({ action: 'recurringOrderToggle', id });
  if (r.ok) loadRecurring();
  else toast('操作失敗', 'er');
}

async function deleteRecurring(id) {
  if (!confirm('確定刪除此定期訂單？')) return;
  var r = await api({ action: 'recurringOrderDelete', id });
  if (r.ok) { toast('已刪除', 'ok'); loadRecurring(); }
  else toast('刪除失敗', 'er');
}

// ── 每次開啟頁面自動建立今日定期訂單 ────────────────────
async function autoCreateTodayRecurring() {
  var todayStr = new Date().toISOString().slice(0,10);
  var todayDay = new Date().getDay(); // 0=日,1=一...
  // 防重複：localStorage 記錄今天已建立過
  var lastRun = localStorage.getItem('lw_recurring_last');
  if (lastRun === todayStr) return;

  var r = await api({ action: 'recurringOrderGetAll' });
  if (!r.ok || !r.data || !r.data.length) return;

  var created = 0;
  for (var rec of r.data) {
    var isActive = rec.active === 'true' || rec.active === true;
    if (!isActive) continue;
    var days = [];
    try { days = JSON.parse(rec.days||'[]'); } catch(e){ continue; }
    if (!days.includes(todayDay)) continue;

    // 建立出貨單
    var saveR = await api({
      action: 'deliverySave',
      shipDate: todayStr,
      name: rec.name,
      phone: rec.phone,
      address: rec.address,
      items: rec.items,
      payment: rec.payment,
      amount: '',
      note: (rec.note ? rec.note + '・' : '') + '定期訂單自動建立',
      rawMsg: ''
    });
    if (saveR.ok) created++;
  }

  localStorage.setItem('lw_recurring_last', todayStr);
  if (created > 0) {
    toast('✓ 已自動建立 ' + created + ' 張定期出貨單', 'ok');
    // 重新整理訂單快取
    var or = await api({ action: 'deliveryGetAll' });
    window._orders = or.ok ? (or.data||[]) : [];
  }
}
