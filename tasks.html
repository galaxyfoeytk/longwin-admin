<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>交辦事項 — 龍吟後台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* ── 分頁 ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1rem;background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:0 1rem;}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text-m);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font);}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal);}
.tab-pane{display:none;}.tab-pane.active{display:block;}

/* ── 任務卡片 ── */
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;transition:border-color .15s;}
.task-card:hover{border-color:var(--border-md);}
.task-card.done{opacity:.55;background:var(--bg);}
.task-card.overdue{border-left:3px solid var(--red);}
.task-card.urgent{border-left:3px solid var(--amber);}
.task-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
.task-title{font-size:14px;font-weight:600;flex:1;line-height:1.4;}
.task-title.done-text{text-decoration:line-through;color:var(--text-m);}
.task-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;}
.task-chip{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;display:inline-flex;align-items:center;gap:3px;}
.chip-deadline{background:var(--bg);color:var(--text-m);}
.chip-deadline.overdue{background:var(--red-l);color:var(--red);}
.chip-deadline.soon{background:var(--amber-l);color:var(--amber);}
.chip-source{background:var(--blue-l);color:var(--blue-d);}
.chip-done{background:var(--teal-l);color:var(--teal);}
.chip-pending{background:var(--gray-l);color:var(--gray);}
.chip-inprog{background:var(--purple-l);color:var(--purple);}
.owner-row{font-size:12px;color:var(--text-m);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.owner-tag{font-size:11px;background:var(--teal-l);color:var(--teal);border-radius:20px;padding:2px 8px;font-weight:500;}
.collab-tag{font-size:11px;background:var(--purple-l);color:var(--purple);border-radius:20px;padding:2px 8px;font-weight:500;}
.task-progress{margin-bottom:8px;}
.prog-bar{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:var(--teal);border-radius:3px;transition:width .3s;}
.task-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.task-note{font-size:12px;color:var(--text-m);margin-bottom:8px;padding:6px 10px;background:var(--bg);border-radius:var(--rx);line-height:1.6;}

/* ── 進度選擇 ── */
.prog-select{font-size:12px;border:1px solid var(--border-md);border-radius:var(--rx);padding:3px 8px;background:var(--surface);color:var(--text);font-family:var(--font);cursor:pointer;}

/* ── 篩選列 ── */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.filter-btn{padding:5px 14px;font-size:12px;border-radius:20px;border:1px solid var(--border-md);background:transparent;color:var(--text-m);cursor:pointer;font-family:var(--font);}
.filter-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;}

/* ── 新增 modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--surface);border-radius:var(--r);padding:20px 22px;width:min(500px,100%);max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal h3{font-size:15px;font-weight:700;margin:0 0 14px;}
.member-pill{display:inline-flex;align-items:center;gap:4px;background:var(--teal-l);color:var(--teal);border-radius:20px;padding:4px 10px;font-size:12px;margin:2px;cursor:pointer;border:1px solid transparent;user-select:none;}
.member-pill.selected{background:var(--teal);color:#fff;}
.member-pill.collab-mode.selected{background:var(--purple);color:#fff;}

/* ── 統計列 ── */
.task-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.ts-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;text-align:center;}
.ts-num{font-size:22px;font-weight:700;}
.ts-lbl{font-size:11px;color:var(--text-m);margin-top:2px;}

/* ── spin ── */
.spin{width:13px;height:13px;border:2px solid var(--teal-l);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px;margin-right:5px;}
</style>
</head>
<body>
<div class="tb">
  <div class="tbl" onclick="goHome()">📋</div>
  <div class="page-title-wrap">
    <div class="page-title-main" id="page-title">交辦事項</div>
    <div class="page-title-sub" id="page-sub">任務追蹤・進度管理・逾期通知</div>
  </div>
  <div class="tbr">
    <div class="uc"><div class="ua" id="tav"></div><span class="un" id="tnm"></span><span class="rp" id="trl"></span></div>
    <button class="lgb" onclick="goHome()">🏠 主頁</button>
    <button class="lgb" onclick="doLogout()">↩ 登出</button>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('board')">📋 任務看板</button>
    <button class="tab-btn" onclick="switchTab('done')">✅ 已完成</button>
  </div>

  <!-- ═══ 任務看板 ═══ -->
  <div id="tab-board" class="tab-pane active">
    <!-- 統計 -->
    <div class="task-stats">
      <div class="ts-card"><div class="ts-num" id="stat-all">-</div><div class="ts-lbl">全部</div></div>
      <div class="ts-card"><div class="ts-num" id="stat-overdue" style="color:var(--red)">-</div><div class="ts-lbl">已逾期</div></div>
      <div class="ts-card"><div class="ts-num" id="stat-soon" style="color:var(--amber)">-</div><div class="ts-lbl">即將到期（3日內）</div></div>
      <div class="ts-card"><div class="ts-num" id="stat-done" style="color:var(--teal)">-</div><div class="ts-lbl">已完成</div></div>
    </div>

    <!-- 篩選 + 新增 -->
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
      <div class="filter-bar" style="margin-bottom:0;">
        <button class="filter-btn active" id="f-all" onclick="setFilter('all')">全部</button>
        <button class="filter-btn" id="f-overdue" onclick="setFilter('overdue')">🔴 逾期</button>
        <button class="filter-btn" id="f-soon" onclick="setFilter('soon')">🟡 快到期</button>
        <button class="filter-btn" id="f-mine" onclick="setFilter('mine')">👤 我的</button>
        <button class="filter-btn" id="f-meeting" onclick="setFilter('meeting')">📝 會議交辦</button>
      </div>
      <button class="sbtn g" style="height:34px;font-size:12px;" onclick="openTaskModal()">＋ 新增任務</button>
    </div>

    <div id="taskList"><div style="text-align:center;padding:2rem;color:var(--text-h);font-size:13px;">載入中…</div></div>
  </div>

  <!-- ═══ 已完成 ═══ -->
  <div id="tab-done" class="tab-pane">
    <div id="doneList"><div style="text-align:center;padding:2rem;color:var(--text-h);font-size:13px;">載入中…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="bb"><div class="bd"></div><span class="bt">龍吟古早味飲品專賣・交辦事項</span></div>

<script src="base.js"></script>
<script>
var MEMBERS = ['Brian','紘誠','美君'];
var _tasks = [];
var _filter = 'all';
var _currentUser = '';

window.addEventListener('load', () => {
  var u = buildSubHeader('交辦事項', '任務追蹤・進度管理・逾期通知');
  if (!u) return;
  _currentUser = u.name;
  loadTasks();
  startOverdueCheck();
});

function switchTab(name) {
  document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelectorAll('.tab-btn')[ name === 'board' ? 0 : 1 ].classList.add('active');
  if (name === 'done') renderDone();
}

// ════════════════════════════════════════
// 載入任務
// ════════════════════════════════════════
async function loadTasks() {
  var r = await api({ action: 'tasksGetAll' });
  _tasks = r.ok ? (r.data || []) : [];
  renderBoard();
  renderStats();
}

function setFilter(f) {
  _filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('f-' + f)?.classList.add('active');
  renderBoard();
}

function renderStats() {
  var active = _tasks.filter(t => t.status !== '已完成');
  var now = new Date(); now.setHours(0,0,0,0);
  var overdue = active.filter(t => t.deadline && new Date(t.deadline) < now).length;
  var soon = active.filter(t => {
    if (!t.deadline) return false;
    var d = new Date(t.deadline); d.setHours(0,0,0,0);
    var diff = (d - now) / 86400000;
    return diff >= 0 && diff <= 3;
  }).length;
  var done = _tasks.filter(t => t.status === '已完成').length;
  document.getElementById('stat-all').textContent = active.length;
  document.getElementById('stat-overdue').textContent = overdue;
  document.getElementById('stat-soon').textContent = soon;
  document.getElementById('stat-done').textContent = done;
}

function renderBoard() {
  var now = new Date(); now.setHours(0,0,0,0);
  var active = _tasks.filter(t => t.status !== '已完成');

  var filtered = active.filter(t => {
    if (_filter === 'all') return true;
    if (_filter === 'overdue') return t.deadline && new Date(t.deadline) < now;
    if (_filter === 'soon') {
      if (!t.deadline) return false;
      var d = new Date(t.deadline); d.setHours(0,0,0,0);
      var diff = (d - now) / 86400000;
      return diff >= 0 && diff <= 3;
    }
    if (_filter === 'mine') {
      return t.owner === _currentUser || (t.collabs && t.collabs.includes(_currentUser));
    }
    if (_filter === 'meeting') return !!t.meetingId;
    return true;
  });

  // 排序：逾期 > 快到期 > 其他（依截止日期）
  filtered.sort((a, b) => {
    var da = a.deadline ? new Date(a.deadline) : new Date('9999-12-31');
    var db = b.deadline ? new Date(b.deadline) : new Date('9999-12-31');
    return da - db;
  });

  var el = document.getElementById('taskList');
  if (!filtered.length) {
    el.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-h);font-size:13px;">此篩選條件無任務</div>';
    return;
  }
  el.innerHTML = filtered.map(t => renderTaskCard(t, now)).join('');
}

function renderDone() {
  var done = _tasks.filter(t => t.status === '已完成');
  var el = document.getElementById('doneList');
  if (!done.length) {
    el.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-h);font-size:13px;">尚無已完成任務</div>';
    return;
  }
  done.sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
  el.innerHTML = done.map(t => renderTaskCard(t, new Date(), true)).join('');
}

function renderTaskCard(t, now, isDoneTab) {
  var deadline = t.deadline ? new Date(t.deadline) : null;
  if (deadline) deadline.setHours(0,0,0,0);
  var diff = deadline ? Math.round((deadline - now) / 86400000) : null;
  var isOverdue = diff !== null && diff < 0 && t.status !== '已完成';
  var isSoon = diff !== null && diff >= 0 && diff <= 3 && t.status !== '已完成';
  var isDone = t.status === '已完成';

  // 截止日 chip
  var dlText = '';
  var dlClass = 'chip-deadline';
  if (t.deadline) {
    if (isOverdue) { dlText = '⚠ 逾期 ' + Math.abs(diff) + ' 天'; dlClass = 'chip-deadline overdue'; }
    else if (isSoon) { dlText = '⏳ ' + (diff === 0 ? '今天到期' : diff + ' 天後到期'); dlClass = 'chip-deadline soon'; }
    else { dlText = '📅 ' + t.deadline; }
  }

  // 狀態 chip
  var statusClass = t.status === '已完成' ? 'chip-done' : t.status === '進行中' ? 'chip-inprog' : 'chip-pending';

  // 進度條
  var prog = parseInt(t.progress) || 0;

  // 負責人
  var ownerHtml = '';
  if (t.owner) ownerHtml += `<span class="owner-tag">👤 ${t.owner}</span>`;
  var collabs = t.collabs ? (Array.isArray(t.collabs) ? t.collabs : JSON.parse(t.collabs || '[]')) : [];
  collabs.forEach(c => { ownerHtml += `<span class="collab-tag">🤝 ${c}</span>`; });

  return `<div class="task-card${isDone ? ' done' : ''}${isOverdue ? ' overdue' : isSoon ? ' urgent' : ''}" id="tc-${t.id}">
    <div class="task-head">
      <div class="task-title${isDone ? ' done-text' : ''}">${t.title}</div>
      <div style="display:flex;gap:5px;flex-shrink:0;">
        ${!isDone ? `<button class="sbtn g" style="height:26px;font-size:11px;padding:0 8px;" onclick="completeTask('${t.id}')">✓ 完成</button>` : ''}
        <button class="sbtn" style="height:26px;font-size:11px;padding:0 8px;background:var(--gray);" onclick="editTask('${t.id}')">編輯</button>
        <button class="sbtn" style="height:26px;font-size:11px;padding:0 8px;background:var(--red-l);color:var(--red);border:1px solid #F7C1C1;" onclick="deleteTask('${t.id}')">刪除</button>
      </div>
    </div>
    <div class="task-meta">
      ${dlText ? `<span class="task-chip ${dlClass}">${dlText}</span>` : ''}
      <span class="task-chip ${statusClass}">${t.status || '待處理'}</span>
      ${t.meetingId ? `<span class="task-chip chip-source">📝 會議交辦</span>` : ''}
      ${t.meetingTitle ? `<span class="task-chip" style="background:var(--blue-l);color:var(--blue-d);font-size:10px;">${t.meetingTitle}</span>` : ''}
    </div>
    ${ownerHtml ? `<div class="owner-row">${ownerHtml}</div>` : ''}
    ${t.note ? `<div class="task-note">${t.note}</div>` : ''}
    ${!isDone ? `<div class="task-progress">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <span style="font-size:11px;color:var(--text-m);">進度</span>
        <select class="prog-select" onchange="updateProgress('${t.id}', this.value)">
          <option value="0"${prog===0?' selected':''}>0%</option>
          <option value="25"${prog===25?' selected':''}>25%</option>
          <option value="50"${prog===50?' selected':''}>50%</option>
          <option value="75"${prog===75?' selected':''}>75%</option>
          <option value="100"${prog===100?' selected':''}>100%</option>
        </select>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${prog}%"></div></div>
    </div>` : `<div style="font-size:11px;color:var(--text-h);">完成時間：${t.doneAt||''}</div>`}
  </div>`;
}

// ════════════════════════════════════════
// CRUD
// ════════════════════════════════════════
async function completeTask(id) {
  var t = _tasks.find(t => t.id === id);
  if (!t) return;
  var now = new Date().toLocaleString('zh-TW', { hour12: false });
  t.status = '已完成'; t.doneAt = now; t.progress = 100;
  renderBoard(); renderStats();
  await api({ action: 'taskUpdate', id, status: '已完成', doneAt: now, progress: 100 });
  toast('✓ 任務已完成', 'ok');
}

async function updateProgress(id, val) {
  var t = _tasks.find(t => t.id === id);
  if (!t) return;
  t.progress = parseInt(val);
  if (val === '100') { t.status = '進行中'; }
  await api({ action: 'taskUpdate', id, progress: val, status: t.status });
}

async function deleteTask(id) {
  if (!confirm('確定刪除此任務？')) return;
  var r = await api({ action: 'taskDelete', id });
  if (r.ok) {
    _tasks = _tasks.filter(t => t.id !== id);
    renderBoard(); renderStats();
    toast('已刪除', 'ok');
  } else toast('刪除失敗', 'er');
}

// ════════════════════════════════════════
// 新增 / 編輯 Modal
// ════════════════════════════════════════
var _editingId = null;

function openTaskModal(prefill) {
  _editingId = prefill?.id || null;
  var old = document.getElementById('taskModal');
  if (old) old.remove();

  var p = prefill || {};
  var collabs = p.collabs ? (Array.isArray(p.collabs) ? p.collabs : JSON.parse(p.collabs || '[]')) : [];

  var overlay = document.createElement('div');
  overlay.id = 'taskModal';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <h3>${_editingId ? '編輯任務' : '＋ 新增任務'}</h3>
      <div class="fr one" style="margin-bottom:10px;">
        <div><label class="ffl">任務標題 <span style="color:var(--red)">*</span></label>
          <input class="ffi" id="t-title" placeholder="簡短描述任務內容" value="${p.title||''}">
        </div>
      </div>
      <div class="fr" style="margin-bottom:10px;">
        <div><label class="ffl">截止日期</label>
          <input type="date" class="ffi" id="t-deadline" value="${p.deadline||''}">
        </div>
        <div><label class="ffl">狀態</label>
          <select class="ffs" id="t-status">
            <option value="待處理"${(!p.status||p.status==='待處理')?' selected':''}>待處理</option>
            <option value="進行中"${p.status==='進行中'?' selected':''}>進行中</option>
          </select>
        </div>
      </div>
      <div style="margin-bottom:10px;">
        <label class="ffl">主要負責人</label>
        <div id="owner-pills" style="display:flex;flex-wrap:wrap;gap:4px;">
          ${MEMBERS.map(m => `<span class="member-pill${p.owner===m?' selected':''}" onclick="pickOwner(this,'${m}')">${m}</span>`).join('')}
        </div>
      </div>
      <div style="margin-bottom:10px;">
        <label class="ffl">共同協作（可多選）</label>
        <div id="collab-pills" style="display:flex;flex-wrap:wrap;gap:4px;">
          ${MEMBERS.map(m => `<span class="member-pill collab-mode${collabs.includes(m)?' selected':''}" onclick="toggleCollab(this,'${m}')">${m}</span>`).join('')}
        </div>
      </div>
      <div class="fr one" style="margin-bottom:12px;">
        <div><label class="ffl">備註說明</label>
          <textarea class="ffi" id="t-note" rows="2" style="height:auto;padding:8px 10px;resize:none;" placeholder="補充說明、注意事項…">${p.note||''}</textarea>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="sbtn" style="background:var(--gray);height:36px;" onclick="closeTaskModal()">取消</button>
        <button class="sbtn g" style="height:36px;" onclick="saveTask()">💾 儲存</button>
      </div>
    </div>`;
  overlay.addEventListener('click', closeTaskModal);
  document.body.appendChild(overlay);
  document.getElementById('t-title')?.focus();
}

function editTask(id) {
  var t = _tasks.find(t => t.id === id);
  if (t) openTaskModal(t);
}

function closeTaskModal() {
  var el = document.getElementById('taskModal');
  if (el) el.remove();
}

var _selectedOwner = '';
var _selectedCollabs = [];

function pickOwner(el, name) {
  document.querySelectorAll('#owner-pills .member-pill').forEach(p => p.classList.remove('selected'));
  if (_selectedOwner === name) { _selectedOwner = ''; }
  else { el.classList.add('selected'); _selectedOwner = name; }
}

function toggleCollab(el, name) {
  el.classList.toggle('selected');
  if (el.classList.contains('selected')) {
    if (!_selectedCollabs.includes(name)) _selectedCollabs.push(name);
  } else {
    _selectedCollabs = _selectedCollabs.filter(c => c !== name);
  }
}

async function saveTask() {
  var title = document.getElementById('t-title')?.value.trim();
  if (!title) { toast('請填寫任務標題', 'er'); return; }

  var owner = document.querySelector('#owner-pills .member-pill.selected')?.textContent || _selectedOwner || '';
  var collabEls = document.querySelectorAll('#collab-pills .member-pill.selected');
  var collabs = [...collabEls].map(el => el.textContent);
  var deadline = document.getElementById('t-deadline')?.value || '';
  var status = document.getElementById('t-status')?.value || '待處理';
  var note = document.getElementById('t-note')?.value.trim() || '';

  var params = {
    action: _editingId ? 'taskUpdate' : 'taskSave',
    title, owner, collabs: JSON.stringify(collabs),
    deadline, status, note
  };
  if (_editingId) params.id = _editingId;

  var r = await api(params);
  if (r.ok) {
    closeTaskModal();
    toast(_editingId ? '✓ 已更新' : '✓ 任務已建立', 'ok');
    loadTasks();
  } else toast('儲存失敗', 'er');
}

// ════════════════════════════════════════
// 逾期自動提醒（每小時檢查一次，只在整點觸發）
// ════════════════════════════════════════
function startOverdueCheck() {
  setInterval(checkOverdue, 60000);
  checkOverdue();
}

async function checkOverdue() {
  var now = new Date();
  var h = now.getHours();
  var m = now.getMinutes();
  if (m > 5) return;
  var todayStr = now.toISOString().slice(0,10);
  var key = 'lw_task_overdue_' + todayStr + '_' + h;
  if (localStorage.getItem(key)) return;

  var overdue = _tasks.filter(t => {
    if (t.status === '已完成') return false;
    if (!t.deadline) return false;
    return t.deadline < todayStr;
  });
  if (!overdue.length) return;

  localStorage.setItem(key, '1');

  var lines = ['⚠️ 龍吟系統｜交辦事項逾期提醒', '📅 ' + todayStr, '以下任務已逾期，請儘快處理：'];
  overdue.forEach(t => {
    var who = t.owner ? '（' + t.owner + '）' : '';
    lines.push('・' + t.title + who + '　逾期至 ' + t.deadline);
  });
  await api({ action: 'lineNotifyTask', message: lines.join('\n') });
}
</script>
