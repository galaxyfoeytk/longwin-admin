<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>杯數統計 — 龍吟後台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.month-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.mbtn{padding:5px 14px;border-radius:20px;border:1px solid var(--border-md);background:var(--surface);cursor:pointer;font-size:13px;font-family:var(--font);font-weight:500;}
.mbtn.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.mbtn:hover:not(.active){background:var(--bg);}
.year-select{height:32px;border:1px solid var(--border-md);border-radius:20px;padding:0 12px;font-size:13px;font-family:var(--font);background:var(--surface);cursor:pointer;}
.stat-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.stat-tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:13px;}
.stat-tbl th{background:var(--bg);padding:8px 10px;text-align:center;font-weight:600;border:1px solid var(--border);white-space:nowrap;color:var(--text-m);font-size:12px;}
.stat-tbl td{padding:0;border:1px solid var(--border);text-align:center;vertical-align:middle;}
.stat-tbl tr:hover td{background:rgba(0,119,85,.03);}
.stat-tbl tr.today-row td{background:rgba(0,119,85,.06);}
.stat-tbl tr.total-row td{background:var(--bg);font-weight:700;}
.date-cell{background:var(--bg);font-weight:600;font-size:13px;padding:8px 10px;color:var(--text-m);white-space:nowrap;}
.auto-cell{padding:8px 6px;font-weight:700;font-size:14px;color:var(--teal);}
.cell-btn{display:block;width:100%;min-height:38px;padding:8px 4px;background:none;border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:var(--font);color:var(--text);text-align:center;transition:background .1s;}
.cell-btn:hover{background:var(--teal-l);}
.cell-btn.empty{color:var(--text-h);}
.month-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.ms-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;text-align:center;}
.ms-num{font-size:22px;font-weight:800;color:var(--teal);}
.ms-lbl{font-size:11px;color:var(--text-m);margin-top:2px;}
.numpad-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:480px){.numpad-overlay{align-items:center;}}
.numpad-box{background:var(--surface);border-radius:16px 16px 0 0;padding:16px 16px 28px;width:100%;max-width:360px;box-shadow:0 -4px 32px rgba(0,0,0,.2);}
@media(min-width:480px){.numpad-box{border-radius:16px;}}
.numpad-label{font-size:12px;color:var(--text-m);margin-bottom:6px;text-align:center;}
.numpad-display{font-size:32px;font-weight:800;text-align:center;padding:10px;background:var(--bg);border-radius:var(--rs);margin-bottom:12px;min-height:56px;letter-spacing:.05em;}
.numpad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
.nk{height:58px;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer;font-family:var(--font);color:var(--text);transition:all .1s;display:flex;align-items:center;justify-content:center;}
.nk:active,.nk:hover{background:var(--teal-l);border-color:var(--teal);}
.nk.zero{grid-column:1/3;}
.nk.del{background:var(--bg);font-size:18px;}
.nk.del:active{background:var(--red-l);}
.numpad-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
.nk-cancel{height:46px;border:1.5px solid var(--border-md);border-radius:var(--rs);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);color:var(--text-m);}
.nk-confirm{height:46px;border:none;border-radius:var(--rs);background:var(--teal);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);color:#fff;}
</style>
</head>
<body>
<div class="tb">
  <div class="tbl" onclick="goHome()">🥤</div>
  <div class="page-title-wrap">
    <div class="page-title-main" id="page-title">杯數統計</div>
    <div class="page-title-sub" id="page-sub">仙草・杏仁・仙草撞奶・仙草罐・杏仁罐</div>
  </div>
  <div class="tbr">
    <div class="uc"><div class="ua" id="tav"></div><span class="un" id="tnm"></span><span class="rp" id="trl"></span></div>
    <button class="lgb" onclick="goHome()">🏠</button>
    <button class="lgb" onclick="doLogout()">↩</button>
  </div>
</div>

<div class="main">
  <div style="margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <select class="year-select" id="yearSel" onchange="onYearChange()"></select>
    <div class="month-bar" id="monthBar" style="margin-bottom:0;"></div>
  </div>

  <div class="month-summary">
    <div class="ms-card"><div class="ms-num" id="sumTotal">—</div><div class="ms-lbl">本月總杯數</div></div>
    <div class="ms-card"><div class="ms-num" id="sumJelly">—</div><div class="ms-lbl">仙草(杯)</div></div>
    <div class="ms-card"><div class="ms-num" id="sumAlmond">—</div><div class="ms-lbl">杏仁(杯)</div></div>
  </div>

  <div class="fc">
    <div class="fct" style="display:flex;justify-content:space-between;align-items:center;">
      <span id="tableTitle">杯數統計表</span>
      <button class="sbtn g" style="height:30px;font-size:12px;" onclick="saveAll()">💾 儲存</button>
    </div>
    <div class="stat-wrap">
      <table class="stat-tbl">
        <thead>
          <tr>
            <th style="min-width:54px;">日期</th>
            <th style="min-width:64px;">仙草(杯)</th>
            <th style="min-width:64px;">杏仁(杯)</th>
            <th style="min-width:64px;">仙草撞奶</th>
            <th style="min-width:64px;">仙草罐</th>
            <th style="min-width:64px;">杏仁罐</th>
            <th style="min-width:64px;color:var(--teal)">總杯數</th>
          </tr>
        </thead>
        <tbody id="statBody"></tbody>
        <tfoot id="statFoot"></tfoot>
      </table>
    </div>
  </div>
</div>

<!-- 數字鍵盤 -->
<div id="numpadOverlay" class="numpad-overlay" style="display:none;" onclick="cancelNumpad()">
  <div class="numpad-box" onclick="event.stopPropagation()">
    <div class="numpad-label" id="numpadLabel">輸入數量</div>
    <div class="numpad-display" id="numpadDisplay">0</div>
    <div class="numpad-grid">
      <button class="nk" onclick="numKey('7')">7</button><button class="nk" onclick="numKey('8')">8</button><button class="nk" onclick="numKey('9')">9</button>
      <button class="nk" onclick="numKey('4')">4</button><button class="nk" onclick="numKey('5')">5</button><button class="nk" onclick="numKey('6')">6</button>
      <button class="nk" onclick="numKey('1')">1</button><button class="nk" onclick="numKey('2')">2</button><button class="nk" onclick="numKey('3')">3</button>
      <button class="nk zero" onclick="numKey('0')">0</button><button class="nk del" onclick="numDel()">⌫</button>
    </div>
    <div class="numpad-actions">
      <button class="nk-cancel" onclick="cancelNumpad()">取消</button>
      <button class="nk-confirm" onclick="confirmNumpad()">確認</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="bb"><div class="bd"></div><span class="bt">龍吟古早味飲品專賣・杯數統計</span></div>

<script src="base.js"></script>
<script>
// 欄位對應 Sheets：仙草(杯)、杏仁(杯)、仙草撞奶、仙草罐、杏仁罐
var FIELDS = ['jelly','almond','milk','jelly_can','almond_can'];
var FIELD_LABELS = {
  jelly:'仙草(杯)', almond:'杏仁(杯)',
  milk:'仙草撞奶', jelly_can:'仙草罐', almond_can:'杏仁罐'
};

var TW_NOW_YEAR = new Date().getFullYear() - 1911;
var TW_START_YEAR = 111;
var _currentYear = TW_NOW_YEAR;
var _currentMonth = new Date().getMonth() + 1;
var _data = {};
var _dirty = false;
var _numTarget = null;
var _numStr = '';

window.addEventListener('load', () => {
  var u = buildSubHeader('杯數統計', '仙草・杏仁・仙草撞奶・仙草罐・杏仁罐');
  if (!u) return;
  buildYearSel();
  buildMonthBar();
  loadMonth();
});

function buildYearSel() {
  var sel = document.getElementById('yearSel');
  for (var y = TW_NOW_YEAR; y >= TW_START_YEAR; y--) {
    var opt = document.createElement('option');
    opt.value = y; opt.textContent = y + ' 年';
    if (y === _currentYear) opt.selected = true;
    sel.appendChild(opt);
  }
}

function onYearChange() {
  if (_dirty && !confirm('尚未儲存，確定切換？')) {
    document.getElementById('yearSel').value = _currentYear; return;
  }
  _currentYear = parseInt(document.getElementById('yearSel').value);
  _dirty = false; buildMonthBar(); loadMonth();
}

function buildMonthBar() {
  var bar = document.getElementById('monthBar');
  bar.innerHTML = Array.from({length:12},(_,i)=>i+1).map(m =>
    `<button class="mbtn${m===_currentMonth?' active':''}" id="mb-${m}" onclick="switchMonth(${m})">${m}月</button>`
  ).join('');
}

function switchMonth(m) {
  if (_dirty && !confirm('尚未儲存，確定切換？')) return;
  _currentMonth = m; _dirty = false;
  document.querySelectorAll('.mbtn').forEach(b => b.classList.remove('active'));
  document.getElementById('mb-' + m)?.classList.add('active');
  loadMonth();
}

async function loadMonth() {
  document.getElementById('tableTitle').textContent =
    _currentYear + '年' + _currentMonth + '月 杯數統計表';
  var r = await api({ action:'cupsStatGet', year:_currentYear, month:_currentMonth });
  _data = {};
  if (r.ok && r.data) {
    (r.data||[]).forEach(row => {
      FIELDS.forEach(f => { _data[row.day+'_'+f] = parseInt(row[f])||0; });
    });
  }
  renderTable();
  updateSummary();
}

function renderTable() {
  var days = new Date(_currentYear+1911, _currentMonth, 0).getDate();
  var todayDay = (new Date().getFullYear()-1911===_currentYear && new Date().getMonth()+1===_currentMonth)
    ? new Date().getDate() : -1;

  document.getElementById('statBody').innerHTML = Array.from({length:days},(_,i) => {
    var d = i+1, isToday = d===todayDay;
    var vals = FIELDS.map(f => v(d,f));
    var total = vals.reduce((s,x)=>s+x, 0);
    return `<tr class="${isToday?'today-row':''}">
      <td class="date-cell">${d}${isToday?' 🔵':''}</td>
      ${FIELDS.map((f,fi) => cBtn(d,f,vals[fi])).join('')}
      <td class="auto-cell" id="tot-${d}">${total||0}</td>
    </tr>`;
  }).join('');

  renderFoot(days);
}

function cBtn(day, field, val) {
  return `<td><button class="cell-btn${val?'':' empty'}" id="c-${day}-${field}"
    onclick="openNumpad(${day},'${field}')"
    style="${val?'color:var(--teal);font-weight:700;':''}">${val||'—'}</button></td>`;
}

function renderFoot(days) {
  var tots = {}; FIELDS.forEach(f=>{tots[f]=0;});
  for(var d=1;d<=days;d++) FIELDS.forEach(f=>{tots[f]+=v(d,f);});
  var grand = FIELDS.reduce((s,f)=>s+tots[f],0);
  document.getElementById('statFoot').innerHTML = `<tr class="total-row">
    <td class="date-cell" style="color:var(--text);">合計</td>
    ${FIELDS.map(f=>`<td class="auto-cell" style="font-size:13px;">${tots[f]}</td>`).join('')}
    <td class="auto-cell" style="font-size:14px;">${grand}</td>
  </tr>`;
}

function updateSummary() {
  var days = new Date(_currentYear+1911, _currentMonth, 0).getDate();
  var total=0, jelly=0, almond=0;
  for(var d=1;d<=days;d++){
    FIELDS.forEach(f=>{total+=v(d,f);});
    jelly  += v(d,'jelly');
    almond += v(d,'almond');
  }
  document.getElementById('sumTotal').textContent  = total;
  document.getElementById('sumJelly').textContent  = jelly;
  document.getElementById('sumAlmond').textContent = almond;
}

function v(day,field){ return parseInt(_data[day+'_'+field])||0; }

function openNumpad(day, field) {
  _numTarget = {day, field};
  _numStr = v(day,field)===0 ? '' : String(v(day,field));
  document.getElementById('numpadLabel').textContent = day+'日・'+FIELD_LABELS[field];
  document.getElementById('numpadDisplay').textContent = _numStr||'0';
  document.getElementById('numpadOverlay').style.display = 'flex';
}
function numKey(k){ if(_numStr.length>=5)return; _numStr+=k; document.getElementById('numpadDisplay').textContent=_numStr||'0'; }
function numDel(){ _numStr=_numStr.slice(0,-1); document.getElementById('numpadDisplay').textContent=_numStr||'0'; }
function cancelNumpad(){ document.getElementById('numpadOverlay').style.display='none'; _numTarget=null; _numStr=''; }

function confirmNumpad() {
  if (!_numTarget) return;
  var val = parseInt(_numStr)||0;
  var {day, field} = _numTarget;
  _data[day+'_'+field] = val;
  _dirty = true;

  var btn = document.getElementById(`c-${day}-${field}`);
  if (btn) {
    btn.textContent = val||'—';
    btn.className = 'cell-btn'+(val?'':' empty');
    btn.style.color = val?'var(--teal)':'';
    btn.style.fontWeight = val?'700':'';
  }
  var total = FIELDS.reduce((s,f)=>s+v(day,f), 0);
  var totEl = document.getElementById('tot-'+day);
  if (totEl) totEl.textContent = total;

  var days = new Date(_currentYear+1911, _currentMonth, 0).getDate();
  renderFoot(days);
  updateSummary();
  cancelNumpad();
}

async function saveAll() {
  var days = new Date(_currentYear+1911, _currentMonth, 0).getDate();
  var rows = Array.from({length:days},(_,i)=>{
    var d=i+1, row={day:d};
    FIELDS.forEach(f=>{row[f]=v(d,f);});
    return row;
  });
  var r = await api({action:'cupsStatSave', year:_currentYear, month:_currentMonth, data:JSON.stringify(rows)});
  if (r.ok) { toast('✓ 已儲存','ok'); _dirty=false; }
  else toast('儲存失敗','er');
}
</script>
</body>
</html>
